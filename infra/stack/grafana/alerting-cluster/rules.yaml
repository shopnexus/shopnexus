# Alerts on the cluster's Prometheus; the chart adds them with clusterPrometheus.
apiVersion: 1
groups:
- orgId: 1
  name: Cluster
  folder: ShopNexus
  interval: 1m
  rules:
  - uid: sn-site-down
    title: Site không truy cập được
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.instance }} không trả lời được từ trong cụm.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: probe_success{job="blackbox"}
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sn-cert-expiry
    title: Chứng chỉ TLS sắp hết hạn
    condition: B
    for: 1h
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Chứng chỉ TLS của {{ $labels.instance }} hết hạn sau {{ humanize $values.A.Value }} ngày.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
  - uid: sn-pod-restarts
    title: Pod khởi động lại liên tục
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Pod {{ $labels.pod }} đã khởi động lại {{ $values.A.Value }} lần trong 15 phút.
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="__NAMESPACE__"}[15m]))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
  - uid: sn-pod-not-ready
    title: Pod chưa sẵn sàng
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Pod {{ $labels.pod }} đang chạy nhưng chưa sẵn sàng hơn 10 phút.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: sum by (pod) (kube_pod_status_ready{namespace="__NAMESPACE__",condition="false"} * on (namespace, pod) group_left () (kube_pod_status_phase{namespace="__NAMESPACE__",phase="Running"} == 1))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: sn-node-disk
    title: Disk node sắp đầy
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: Disk của node {{ $labels.node }} đã dùng {{ humanizePercentage $values.A.Value }}.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: 1 - min by (node) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
  - uid: sn-postgres-down
    title: Postgres không chạy
    condition: B
    for: 3m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: Exporter của Postgres báo database không lên, hoặc không còn được scrape.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: min(cnpg_collector_up{namespace="__NAMESPACE__"}) or vector(0)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sn-postgres-connections
    title: Postgres sắp hết kết nối
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Postgres đang dùng {{ humanizePercentage $values.A.Value }} số kết nối cho phép.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: sum(cnpg_backends_total{namespace="__NAMESPACE__"}) / max(cnpg_pg_settings_setting{namespace="__NAMESPACE__",name="max_connections"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.85
  - uid: sn-postgres-long-transaction
    title: Postgres có transaction treo
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Có transaction Postgres đã mở {{ humanizeDuration $values.A.Value }}: nó giữ lock và cản vacuum.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: max(cnpg_backends_max_tx_duration_seconds{namespace="__NAMESPACE__"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 600
  - uid: sn-bifrost-failing
    title: Gọi model lỗi
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: '{{ humanizePercentage $values.A.Value }} lượt gọi model qua Bifrost thất bại trong 10 phút qua.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: sum(rate(bifrost_error_requests_total{namespace="__NAMESPACE__"}[10m])) / sum(rate({__name__=~"bifrost_(success|error)_requests_total",namespace="__NAMESPACE__"}[10m])) and on () sum(rate({__name__=~"bifrost_(success|error)_requests_total",namespace="__NAMESPACE__"}[10m]))
          > 0.01
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.2
  - uid: sn-bifrost-key-down
    title: Khóa nhà cung cấp model lỗi
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'Lần gọi gần nhất bằng khóa {{ $labels.key_name }} của {{ $labels.provider }} đã thất bại.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: min by (provider, key_name) (bifrost_provider_key_up{namespace="__NAMESPACE__"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: sn-node-memory
    title: RAM node sắp đầy
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: RAM của node {{ $labels.node }} đã dùng {{ humanizePercentage $values.A.Value }}.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cluster
      model:
        refId: A
        expr: 1 - sum by (node) (node_memory_MemAvailable_bytes) / sum by (node) (node_memory_MemTotal_bytes)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
