stack: prod
domain: shopnexus.id.vn
appEnv: prod
images:
  server: { repository: ghcr.io/shopnexus/server, tag: 0.1.0 }
  website: { repository: ghcr.io/shopnexus/website, tag: 0.1.0 }
  docs: { repository: ghcr.io/shopnexus/docs, tag: 0.1.0 }
  console: { repository: ghcr.io/shopnexus/console, tag: 0.1.0 }
  ai: { repository: ghcr.io/shopnexus/ai, tag: 0.1.0 }
replicas:
  server: 3
  website: 2
  docs: 1
  console: 2
postgres:
  instances: 2
  storage: 10Gi
restate:
  replicas: 3
  storageBytes: 4294967296 # 4 GiB
server:
  carrier: none
  logLevel: info
  pnvTestNumbers: "false"
  emailSender: resend
  firebaseProjectID: shopnexus-26aca
  firebaseProjectNumber: "5362373878"
litellm:
  keys:
    server-llm: { dailyUnits: 2000000, tpmLimit: 100000 }
    server-stt: { dailyUnits: 36000, rpmLimit: 60 }
    server-assist: { dailyUnits: 12000000, tpmLimit: 300000 }   # 2,000 reads a day, 50 a minute
    server-trust: { dailyUnits: 6000000, tpmLimit: 150000 }     # 4,600 checks a day, 115 a minute
    server-embed-index: { dailyUnits: 50000000, rpmLimit: 600 }
    server-embed-search: { dailyUnits: 10000000, rpmLimit: 600 }
