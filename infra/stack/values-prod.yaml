stack: prod
domain: shopnexus.id.vn
appEnv: prod
indexed: true
argocdDashboard: true
# The release workflow (.github/workflows/release.yml) writes these tags:
# every image of a release has the same X.Y.Z, and stack-prod runs the
# umbrella tag vX.Y.Z (infra/argocd/stacks.yaml).
images:
  server: { repository: ghcr.io/shopnexus/server, tag: 0.1.0 }
  website: { repository: ghcr.io/shopnexus/website, tag: 0.1.0 }
  docs: { repository: ghcr.io/shopnexus/docs, tag: 0.1.0 }
  console: { repository: ghcr.io/shopnexus/console, tag: 0.1.0 }
  agent: { repository: ghcr.io/shopnexus/agent, tag: 0.1.0 }
replicas:
  server: 3
  website: 2
  docs: 1
  console: 2
postgres:
  instances: 2
  storage: 10Gi
restate:
  replicas: 3
  storageBytes: 4294967296 # 4 GiB
server:
  # Both off until a partner contract each; sellers link neither.
  carriers: { ghtk: { mode: "off" }, ghn: { mode: "off" } }
  scamChecks: "on"
  logLevel: info
  pnvTestNumbers: "false"
  emailSender: resend
serverAi: { memoryRequest: 6Gi, memoryLimit: 8Gi }
