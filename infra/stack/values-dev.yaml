stack: dev
# Temporary: dev serves the prod domain, indexed, until prod runs from a
# release tag. Then domain goes back to dev.shopnexus.id.vn, without
# indexed and aliasDomains.
domain: shopnexus.id.vn
indexed: true
aliasDomains: [dev.shopnexus.id.vn]
appEnv: dev
server:
  # server-ai on dev loads no SigLIP 2: the machine has no room for its
  # 4.5 GB (2026-11-17), so no photo vectors.
  embed:
    image: false
  # The fakes; GHN live would be mode live and apiUrl
  # https://dev-online-gateway.ghn.vn/shiip/public-api, with GHN's staging
  # partner token and webhook secret sealed in server-secrets.
  carriers: { ghtk: { mode: fake }, ghn: { mode: fake } }
  # Boosts are paid on the fake VNPay page.
  payment: { mode: fake }
  scamChecks: "on"
  logLevel: debug
  pnvTestNumbers: "true"
  emailSender: log
serverAi: { memoryRequest: 2Gi, memoryLimit: 3Gi }
# The agent runtime and package-proxy (templates/agent.yaml), with
# their keys in secrets/dev/agent-secrets.yaml.
agent: { enabled: true }

# Alerts go to the Telegram group of secrets/dev/grafana-secrets.yaml.
lgtm:
  telegram: true
