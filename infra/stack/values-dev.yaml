stack: dev
# Temporary: dev serves the prod domain until prod runs from a release tag.
# Then this goes back to dev.shopnexus.id.vn.
domain: shopnexus.id.vn
aliasDomains: [dev.shopnexus.id.vn]
appEnv: dev
server:
  # server-ai on dev loads no SigLIP 2: the machine has no room for its
  # 4.5 GB (2026-11-17), so no photo vectors.
  embed:
    image: false
  carrier: fake
  logLevel: debug
  pnvTestNumbers: "true"
  emailSender: log
serverAi: { memoryRequest: 2Gi, memoryLimit: 3Gi }
litellm:
  keys:
    server-llm: { dailyUnits: 200000, tpmLimit: 20000 }
    # About 5,500 tokens a read (8 frames at 768 px, the subcategories, the
    # transcript): 200 reads a day, 10 a minute.
    server-assist: { dailyUnits: 1200000, tpmLimit: 60000 }
    # About 1,300 tokens a check (the prompt and 20 short messages): 460
    # checks a day, 23 a minute.
    server-trust: { dailyUnits: 600000, tpmLimit: 30000 }
    # 10M tokens: about 1,700 listings of 10 photos a day at 576 tokens a photo.
    server-embed-index: { dailyUnits: 10000000, rpmLimit: 120 }
    server-embed-search: { dailyUnits: 1000000, rpmLimit: 60 }
    agent: { tpmLimit: 100000 }
