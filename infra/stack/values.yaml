# values-dev.yaml and values-prod.yaml set these three; the chart fails without them.
stack: ""     # dev | prod
domain: ""    # dev.shopnexus.id.vn | shopnexus.id.vn
appEnv: ""    # the server's APP_ENV: dev | prod

# The chart includes the SealedSecrets in <secretsDir>/<stack>/*.yaml. The
# chart's tests set tests/secrets, which holds probes.
secretsDir: secrets

images:
  server: { repository: ghcr.io/shopnexus/server, tag: main }
  website: { repository: ghcr.io/shopnexus/website, tag: main }
  docs: { repository: ghcr.io/shopnexus/docs, tag: main }
  console: { repository: ghcr.io/shopnexus/console, tag: main }
  ai: { repository: ghcr.io/shopnexus/ai, tag: main }
  postgres: { repository: paradedb/paradedb, tag: 0.26.4-pg18 }
  restate: { repository: restatedev/restate, tag: 1.8.1 }
  rustfs: { repository: rustfs/rustfs, tag: 1.0.4 }
  litellm: { repository: ghcr.io/berriai/litellm-database, tag: v1.108.0 }
  tei: { repository: ghcr.io/huggingface/text-embeddings-inference, tag: cpu-1.9.4 }
  curl: { repository: curlimages/curl, tag: 8.23.0 }
  lgtm: { repository: grafana/otel-lgtm, tag: 0.37.0 }

console:
  enabled: true
  port: 80

replicas:
  server: 1
  website: 1
  docs: 1
  console: 1

postgres:
  instances: 1
  storage: 5Gi

restate:
  replicas: 1
  storageBytes: 2147483648 # 2 GiB

rustfs:
  storage: 10Gi

# Grafana's dashboards and the telemetry Loki, Tempo and Prometheus keep.
lgtm:
  storage: 5Gi

# The stack's provider of self-hosted models (repo shopnexus/ai). LiteLLM's
# aliases stt and embed-image call it, and the server calls its frames route;
# nothing outside the stack reaches it.
# Memory: the image carries SigLIP 2 in fp32 (4.5 GB of weights); the int8
# files gave photo vectors at a cosine of 0.55 to the reference and were
# dropped (ai's README, Image). Loaded with Gipformer and one photo embedded,
# the process held 4.34 GiB on 2026-11-10. Two frame requests of a 30 s 1080p
# video and two transcriptions at once peaked at 2.42 GiB on 2026-11-10.
# embedVersion names the SigLIP 2 the image carries; the server stores it with
# every photo vector, so a new one means a reindex.
ai:
  numThreads: 4
  maxConcurrent: 2
  maxUploadMB: 100
  maxAudioSeconds: 300
  embedMaxInputs: 16
  embedMaxConcurrent: 2
  embedMaxImageMB: 10
  # POST /v1/video/frames, which the server calls directly for a video read:
  # videos of 3 to framesMaxSeconds seconds, framesMaxConcurrent at once
  # beside the speech decodes. framesMinSharpness is the floor of a frame's
  # variance of the Laplacian; plan 2026-11-10-video-read, task 13, sets it
  # from phone videos.
  framesMaxConcurrent: 2
  framesMaxSeconds: 35
  framesMinSharpness: 30
  embedVersion: siglip2-so400m-patch16-384@29f74e673c298fd07482d8e20138179282001eb7-fp32
  memoryRequest: 6Gi
  memoryLimit: 8Gi
  startupSeconds: 180

# Text embeddings for LiteLLM's alias embed-text: Hugging Face's Text
# Embeddings Inference on CPU, serving BAAI/bge-m3 at a pinned revision (TEI
# loads its ONNX weights; the revision has no safetensors). The server stores
# bge-m3@<revision> with every vector, so a new revision means a reindex.
# storage "" downloads the weights into an emptyDir on every new pod; a size
# keeps them on a claim. Measured on 2026-11-10 (plan
# 2026-11-09-search-models-infra, task 5): a cold start takes 248 s, 196 s of
# it the 2.2 GB download; with maxBatchTokens 2048, 16 listing texts of about
# 650 tokens peak at 3.4 GiB and take 36 s.
tei:
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  maxClientBatchSize: 16
  maxBatchTokens: 2048
  storage: 5Gi
  startupSeconds: 500
  memoryRequest: 3584Mi
  memoryLimit: 7Gi

# The stack's LiteLLM. The server calls it only under the aliases below; the
# model and backend behind each alias are set here, and a new alias or key is
# an edit of this block. Budgets count money: a token and a second of audio
# are each priced at 1e-6, so 1 of budget is 1M tokens or 1M seconds. A key's
# dailyUnits is in the unit of its aliases' price; the chart divides it by 1M
# for max_budget. A key has tpmLimit or rpmLimit.
litellm:
  aliases:
    search:
      model: openai/claude-haiku-5-5
      apiBase: http://host.k3d.internal:8317/v1   # cli-proxy-api on the host
      apiKeySecret: LLM_UPSTREAM_API_KEY          # a key of litellm-secrets
      price: token
    listing-read:
      model: openai/claude-haiku-5-5
      apiBase: http://host.k3d.internal:8317/v1   # cli-proxy-api on the host, as search
      apiKeySecret: LLM_UPSTREAM_API_KEY
      price: token
    scam-check:
      model: openai/claude-haiku-5-5
      apiBase: http://host.k3d.internal:8317/v1   # cli-proxy-api on the host, as search
      apiKeySecret: LLM_UPSTREAM_API_KEY
      price: token
    stt:
      model: openai/gipformer-1.5   # LiteLLM's model string, provider prefix included
      apiBase: http://ai:8000/v1
      mode: audio_transcription
      price: second
    embed-text:
      model: openai/bge-m3   # TEI serves one model and ignores the name
      apiBase: http://tei:80/v1
      mode: embedding
      price: token
    embed-image:
      model: openai/siglip2-so400m-patch16-384
      apiBase: http://ai:8000/v1
      mode: embedding
      price: token   # ai counts 576 tokens an image, a text its tokens
  keys:
    server-llm: { secret: LLM_API_KEY, models: [search], dailyUnits: 0, tpmLimit: 0 }   # set per stack
    server-stt: { secret: STT_API_KEY, models: [stt], dailyUnits: 0, rpmLimit: 0 }      # set per stack
    server-assist: { secret: ASSIST_LLM_API_KEY, models: [listing-read], dailyUnits: 0, tpmLimit: 0 }  # set per stack
    server-trust: { secret: TRUST_LLM_API_KEY, models: [scam-check], dailyUnits: 0, tpmLimit: 0 }   # set per stack
    server-embed-index: { secret: EMBED_INDEX_API_KEY, models: [embed-text, embed-image], dailyUnits: 0, rpmLimit: 0 }    # set per stack
    server-embed-search: { secret: EMBED_SEARCH_API_KEY, models: [embed-text, embed-image], dailyUnits: 0, rpmLimit: 0 }  # set per stack

server:
  # The server's embedding settings; the aliases and the versions come from
  # litellm, tei and ai. The similarity floors are starting values that the
  # server's search eval tunes.
  embed:
    timeout: 15s
    slots: 2
    textMinSimilarity: "0.45"
    photoMinSimilarity: "0.6"
  # A read's one call to ai, speech to text, the model or Chợ Tốt. Link
  # reads call Chợ Tốt's public gateway and the CDN its photos are on; the
  # server reads no other origin.
  assist:
    callTimeout: 30s
    chototGatewayURL: https://gateway.chotot.com
    chototCDNURL: https://cdn.chotot.com
  # A scam check's one call to the model.
  trust:
    callTimeout: 20s
  # carrier: where the server makes and reads shipments, set per stack:
  # fake in values-dev.yaml (with it the server serves
  # POST /v1/dev/shipments/{code}/status to anyone), none in
  # values-prod.yaml. The server refuses fake with APP_ENV=prod. live
  # (GHTK and GHN) waits for the GHTK partner contract.
  # How often a shipped order's shipment is read from its carrier.
  carrierPollEvery: 2h
  logLevel: info
  pnvTestNumbers: "true"
  # How sign-in codes are mailed: log or resend. APP_ENV=prod refuses log.
  emailSender: log
  # The sender address; its domain is verified at Resend.
  emailFrom: "ShopNexus <no-reply@shopnexus.id.vn>"
  # The Web OAuth client of the Firebase project; empty turns Google
  # sign-in off.
  googleClientID: ""
  firebaseProjectID: shopnexus-26aca
  firebaseProjectNumber: "5362373878"
