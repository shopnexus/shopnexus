# values-dev.yaml and values-prod.yaml set these three; the chart fails without them.
stack: ""     # dev | prod
domain: ""    # dev.shopnexus.id.vn | shopnexus.id.vn
appEnv: ""    # the server's APP_ENV: dev | prod

# The chart includes the SealedSecrets in <secretsDir>/<stack>/*.yaml. The
# chart's tests set tests/secrets, which holds probes.
secretsDir: secrets

images:
  server: { repository: ghcr.io/shopnexus/server, tag: main }
  website: { repository: ghcr.io/shopnexus/website, tag: main }
  docs: { repository: ghcr.io/shopnexus/docs, tag: main }
  console: { repository: ghcr.io/shopnexus/console, tag: main }
  ai: { repository: ghcr.io/shopnexus/ai, tag: main }
  postgres: { repository: paradedb/paradedb, tag: 0.26.4-pg18 }
  restate: { repository: restatedev/restate, tag: 1.8.1 }
  rustfs: { repository: rustfs/rustfs, tag: 1.0.4 }
  litellm: { repository: ghcr.io/berriai/litellm-database, tag: v1.108.0 }
  curl: { repository: curlimages/curl, tag: 8.23.0 }
  lgtm: { repository: grafana/otel-lgtm, tag: 0.37.0 }

console:
  enabled: true
  port: 80

replicas:
  server: 1
  website: 1
  docs: 1
  console: 1

postgres:
  instances: 1
  storage: 5Gi

restate:
  replicas: 1
  storageBytes: 2147483648 # 2 GiB

rustfs:
  storage: 10Gi

# Grafana's dashboards and the telemetry Loki, Tempo and Prometheus keep.
lgtm:
  storage: 5Gi

# The stack's provider of self-hosted models (repo shopnexus/ai). LiteLLM's
# alias stt calls it; nothing outside the stack reaches it.
ai:
  numThreads: 4
  maxConcurrent: 2
  maxUploadMB: 100
  maxAudioSeconds: 300

# The stack's LiteLLM. The server calls it only under the aliases below; the
# model and backend behind each alias are set here, and a new alias or key is
# an edit of this block. Budgets count money: a token and a second of audio
# are each priced at 1e-6, so 1 of budget is 1M tokens or 1M seconds. A key's
# dailyUnits is in the unit of its aliases' price; the chart divides it by 1M
# for max_budget. A key has tpmLimit or rpmLimit.
litellm:
  aliases:
    search:
      model: openai/claude-haiku-5-5
      apiBase: http://host.k3d.internal:8317/v1   # cli-proxy-api on the host
      apiKeySecret: LLM_UPSTREAM_API_KEY          # a key of litellm-secrets
      price: token
    stt:
      model: openai/gipformer-1.5   # LiteLLM's model string, provider prefix included
      apiBase: http://ai:8000/v1
      mode: audio_transcription
      price: second
  keys:
    server-llm: { secret: LLM_API_KEY, models: [search], dailyUnits: 0, tpmLimit: 0 }   # set per stack
    server-stt: { secret: STT_API_KEY, models: [stt], dailyUnits: 0, rpmLimit: 0 }      # set per stack

server:
  logLevel: info
  pnvTestNumbers: "true"
  firebaseProjectID: shopnexus-26aca
  firebaseProjectNumber: "5362373878"
