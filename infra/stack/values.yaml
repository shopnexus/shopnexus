# values-dev.yaml and values-prod.yaml set these three; the chart fails without them.
stack: ""     # dev | prod
domain: ""    # dev.shopnexus.id.vn | shopnexus.id.vn
appEnv: ""    # the server's APP_ENV: dev | prod

# The chart includes the SealedSecrets in <secretsDir>/<stack>/*.yaml. The
# chart's tests set tests/secrets, which holds probes.
secretsDir: secrets

images:
  server: { repository: ghcr.io/shopnexus/server, tag: main }
  website: { repository: ghcr.io/shopnexus/website, tag: main }
  docs: { repository: ghcr.io/shopnexus/docs, tag: main }
  console: { repository: ghcr.io/shopnexus/console, tag: main }
  agent: { repository: ghcr.io/shopnexus/agent, tag: main }
  postgres: { repository: paradedb/paradedb, tag: 0.26.4-pg18 }
  restate: { repository: restatedev/restate, tag: 1.8.1 }
  rustfs: { repository: rustfs/rustfs, tag: 1.0.4 }
  lgtm: { repository: grafana/otel-lgtm, tag: 0.37.0 }
  pgweb: { repository: sosedoff/pgweb, tag: 0.17.0 }

console:
  enabled: true
  port: 80

replicas:
  server: 1
  website: 1
  docs: 1
  console: 1
  agent: 1

postgres:
  instances: 1
  storage: 5Gi

restate:
  replicas: 1
  storageBytes: 2147483648 # 2 GiB

rustfs:
  storage: 10Gi

# Argo CD has one server per cluster, and one stack routes argocd.<domain>
# to it behind the console's sign-in: prod's, or dev's on a cluster that
# runs dev only (the Application sets the parameter).
argocdDashboard: false

# Grafana's dashboards and the telemetry Loki, Tempo and Prometheus keep.
lgtm:
  storage: 5Gi
  # Grafana's second Prometheus, the cluster's (infra/platform/prometheus.yaml).
  # Empty leaves Grafana with the one inside lgtm.
  clusterPrometheus: http://prometheus-server.monitoring.svc

# The console agent (repo shopnexus/agent): no Ingress, only the server
# reaches it, and it reaches only the server's MCP port. Its settings are in
# env/agent.env, which docker-compose.yml reads too.
agent:
  memoryRequest: 256Mi
  memoryLimit: 512Mi

# The server's settings that differ between stacks; the ones every stack
# shares are in env/server.env, which docker-compose.yml reads too.
server:
  # text and image turn each kind of vector on, through ai-gateway's aliases
  # embed-text and embed-image (repo shopnexus/ai); a stack whose ai-models
  # loads no SigLIP 2 sets image false.
  embed:
    text: true
    image: true
  # carrier: where the server makes and reads shipments, set per stack:
  # fake in values-dev.yaml (with it the server serves
  # POST /v1/dev/shipments/{code}/status to anyone), none in
  # values-prod.yaml. The server refuses fake with APP_ENV=prod. live
  # (GHTK and GHN) waits for the GHTK partner contract.
  logLevel: info
  pnvTestNumbers: "true"
  # How sign-in codes are mailed: log or resend. APP_ENV=prod refuses log.
  emailSender: log
