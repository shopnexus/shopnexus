# values-dev.yaml and values-prod.yaml set these three; the chart fails without them.
stack: ""     # dev | prod
domain: ""    # dev.shopnexus.id.vn | shopnexus.id.vn
appEnv: ""    # the server's APP_ENV: dev | prod

# The chart includes the SealedSecrets in <secretsDir>/<stack>/*.yaml. The
# chart's tests set tests/secrets, which holds probes.
secretsDir: secrets

images:
  server: { repository: ghcr.io/shopnexus/server, tag: main }
  website: { repository: ghcr.io/shopnexus/website, tag: main }
  docs: { repository: ghcr.io/shopnexus/docs, tag: main }
  console: { repository: ghcr.io/shopnexus/console, tag: main }
  postgres: { repository: paradedb/paradedb, tag: 0.26.4-pg18 }
  restate: { repository: restatedev/restate, tag: 1.8.1 }
  rustfs: { repository: rustfs/rustfs, tag: 1.0.4 }
  litellm: { repository: ghcr.io/berriai/litellm-database, tag: v1.108.0 }
  curl: { repository: curlimages/curl, tag: 8.23.0 }
  lgtm: { repository: grafana/otel-lgtm, tag: 0.37.0 }

console:
  enabled: true
  port: 80

replicas:
  server: 1
  website: 1
  docs: 1
  console: 1

postgres:
  instances: 1
  storage: 5Gi

restate:
  replicas: 1
  storageBytes: 2147483648 # 2 GiB

rustfs:
  storage: 10Gi

# Grafana's dashboards and the telemetry Loki, Tempo and Prometheus keep.
lgtm:
  storage: 5Gi

# The stack's LiteLLM. The server calls it under the alias "search"; the
# alias maps to one model of the upstream OpenAI-compatible API. The budget
# counts tokens: every token is priced at 1e-6, so 1 of budget is 1M tokens.
litellm:
  model: claude-haiku-5-5
  apiBase: http://host.k3d.internal:8317/v1   # cli-proxy-api on the host
  dailyTokens: 0   # set per stack
  tpmLimit: 0      # set per stack

server:
  logLevel: info
  pnvTestNumbers: "true"
  firebaseProjectID: shopnexus-26aca
  firebaseProjectNumber: "5362373878"
