# values-dev.yaml and values-prod.yaml set these three; the chart fails without them.
stack: ""     # dev | prod
domain: ""    # dev.shopnexus.id.vn | shopnexus.id.vn
appEnv: ""    # the server's APP_ENV: dev | prod

# The chart includes the SealedSecrets in <secretsDir>/<stack>/*.yaml. The
# chart's tests set tests/secrets, which holds probes.
secretsDir: secrets

images:
  server: { repository: ghcr.io/shopnexus/server, tag: main }
  website: { repository: ghcr.io/shopnexus/clients/website, tag: main }
  docs: { repository: ghcr.io/shopnexus/docs, tag: main }
  console: { repository: ghcr.io/shopnexus/clients/console, tag: main }
  agent: { repository: ghcr.io/shopnexus/agent, tag: main }
  packageProxy: { repository: ghcr.io/git-pkgs/proxy, tag: v0.11.0 }
  postgres: { repository: paradedb/paradedb, tag: 0.26.4-pg18 }
  restate: { repository: restatedev/restate, tag: 1.8.1 }
  garage: { repository: dxflrs/garage, tag: v2.6.0 }
  garageWebui: { repository: khairul169/garage-webui, tag: 1.1.0 }
  lgtm: { repository: grafana/otel-lgtm, tag: 0.37.0 }
  pgweb: { repository: sosedoff/pgweb, tag: 0.17.0 }
  bifrost: { repository: maximhq/bifrost, tag: v2.6.0 }
  imgproxy: { repository: ghcr.io/imgproxy/imgproxy, tag: v4.0.24 }
  nginx: { repository: nginx, tag: 1.30.7-alpine }

console:
  enabled: true
  port: 80

replicas:
  server: 1
  website: 1
  docs: 1
  console: 1

postgres:
  instances: 1
  storage: 5Gi
  # The vector and BM25 indexes search reads must fit in memory.
  sharedBuffers: 2GB
  effectiveCacheSize: 6GB
  # Above the default 100: four server processes at DATABASE_MAX_CONNS=20
  # double while a Restate version drains, plus Bifrost and pgweb.
  maxConnections: 300

restate:
  replicas: 1
  storageBytes: 2147483648 # 2 GiB

garage:
  storage: 10Gi

# Whether search engines may index domain. Alias domains never are.
indexed: false
# Other domains serving the same stack, with noindex (templates/aliases.yaml).
aliasDomains: []

# Argo CD has one server per cluster, and one stack routes argocd.<domain>
# to it behind the console's sign-in: prod's, or dev's on a cluster that
# runs dev only (the Application sets the parameter).
argocdDashboard: false

# Grafana's dashboards and the telemetry Loki, Tempo and Prometheus keep.
lgtm:
  storage: 5Gi
  # Grafana's second Prometheus, the cluster's (infra/platform/prometheus.yaml).
  # Empty leaves Grafana with the one inside lgtm.
  clusterPrometheus: http://prometheus-server.monitoring.svc
  # Alerts go to Telegram, with the bot token and chat id of Secret
  # grafana-secrets (secrets/<stack>/grafana-secrets.yaml, sealed by hand).
  telegram: false

# The agent runtime (repo shopnexus/agent, templates/agent.yaml) and its
# package-proxy. No Ingress: only the server reaches it. Off until the
# stack's secrets hold its keys (go -C infra run ./cmd/seal <stack>) and the
# cluster runs its sandbox: a pod with hostUsers: false, an unmasked /proc
# and the seccomp profile.
# memoryLimit covers the runtime and every sandbox of its MAX_TURNS turns.
agent:
  enabled: false
  memoryRequest: 512Mi
  memoryLimit: 6Gi
  cacheSize: 20Gi
packageProxy:
  cacheSize: 10Gi

# server-ai (templates/server-ai.yaml): the server with SERVER_ROLE=ai and
# the model files on the PVC models. Each stack sets the memory: SigLIP 2
# with speech and frames held 4.0 GiB idle and 5.3 GiB on 16 photos
# (2026-11-10); speech and frames alone peaked at 2.42 GiB.
serverAi:
  modelsStorage: 10Gi
  startupSeconds: 300
  memoryRequest: ""
  memoryLimit: ""

# The server's settings that differ between stacks; the ones every stack
# shares are in env/server.env, which docker-compose.yml reads too.
server:
  # text and image turn each kind of vector on: text through Bifrost's
  # agent embed-text, image through module ai's SigLIP 2 (AI_EMBED_MODELS). A
  # stack without room for SigLIP 2 in server-ai sets image false.
  embed:
    text: true
    image: true
  # carriers: where the server makes and reads shipments, one switch per
  # carrier (CARRIER_GHTK, CARRIER_GHN), each mode set per stack: live,
  # fake or off. A seller links only the carriers not off. With a fake the
  # server serves POST /v1/dev/shipments/{code}/status to anyone, and it
  # refuses fake with APP_ENV=prod. live needs the carrier's apiUrl (and
  # GHTK's clientSource) here, and its partner token and webhook secret in
  # server-secrets: GHTK_PARTNER_TOKEN and GHTK_WEBHOOK_SECRET, or
  # GHN_PARTNER_TOKEN and GHN_WEBHOOK_SECRET (infra/cmd/seal).
  carriers:
    ghtk: { mode: "", apiUrl: "", clientSource: "" }
    ghn: { mode: "", apiUrl: "" }
  # payment: VNPay, which boosts are paid through (PAYMENT_VNPAY), set per
  # stack: live, fake or off. fake serves /v1/dev/payments/{id} and is
  # refused with APP_ENV=prod; off sells no boost. live needs the terminal
  # here and VNPAY_HASH_SECRET sealed in server-secrets (infra/cmd/seal).
  payment: { mode: "", tmnCode: "", payUrl: "", apiUrl: "", serverIp: "" }
  # scamChecks: on sends each chat message to the scam classifier, a paid
  # model call; off sends none, as for a load test (TRUST_SCAM_CHECKS).
  scamChecks: ""
  logLevel: info
  pnvTestNumbers: "true"
  # How sign-in codes and notices are mailed: log or resend. APP_ENV=prod refuses log.
  emailSender: log
