# Every answer tells browsers to come back over HTTPS for a year and not to
# guess content types. forceSTSHeader: behind the outer proxy Traefik sees
# plain HTTP, while browsers only ever reach the stack over HTTPS.
# Without indexed, every answer also carries noindex.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "1" | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    forceSTSHeader: true
    contentTypeNosniff: true
    {{- if not .Values.indexed }}
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
    {{- end }}
---
# noindex for hosts that are never indexed: the console and alias domains.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "1" | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow"
