{{- /* The operations dashboards, each on a host of its own and behind the
       console's sign-in: Traefik asks the server (forwardAuth) before every
       request, and the path /_dashboard of each host goes to the server,
       which turns the console's one-time ticket into the host's cookie.
       docs/superpowers/specs/2026-11-05-ops-dashboards-design.md */ -}}
{{- $ns := .Release.Namespace }}
{{- define "sn.grafanaDatasources" -}}
apiVersion: 1
datasources:
  - name: Cluster
    type: prometheus
    uid: cluster
    url: {{ .Values.lgtm.clusterPrometheus }}
    editable: false
{{- end }}
{{- if .Values.lgtm.clusterPrometheus }}
# The Prometheus of infra/platform/prometheus.yaml, which scrapes the nodes,
# the containers and kube-state-metrics. Grafana lists it next to the
# Prometheus inside lgtm, which holds the server's own metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lgtm-datasources
  labels: {{- include "sn.labels" . | nindent 4 }}
data:
  cluster.yaml: |
    {{- include "sn.grafanaDatasources" . | nindent 4 }}
---
{{- end }}
# The ShopNexus dashboards (grafana/), which docker-compose.yml mounts too.
# Pods reads the cluster's Prometheus, so only the cluster gets it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lgtm-dashboards
  labels: {{- include "sn.labels" . | nindent 4 }}
data:
  provider.yaml: |
    {{- .Files.Get "grafana/provider.yaml" | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "grafana/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- if .Values.lgtm.clusterPrometheus }}
  {{- range $path, $_ := .Files.Glob "grafana/cluster/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | replace "__NAMESPACE__" $ns | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- define "sn.grafanaAlerting" -}}
server.yaml: |
  {{- .Files.Get "grafana/alerting/rules.yaml" | nindent 2 }}
{{- if .Values.lgtm.clusterPrometheus }}
cluster.yaml: |
  {{- .Files.Get "grafana/alerting-cluster/rules.yaml" | replace "__NAMESPACE__" .Release.Namespace | nindent 2 }}
{{- end }}
{{- if .Values.lgtm.telegram }}
telegram.yaml: |
  {{- .Files.Get "grafana/alerting-cluster/telegram.yaml" | nindent 2 }}
{{- end }}
{{- end }}
# Grafana's alert rules (grafana/alerting, which compose mounts too), the
# cluster's rules with clusterPrometheus, and Telegram with lgtm.telegram.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lgtm-alerting
  labels: {{- include "sn.labels" . | nindent 4 }}
data:
  {{- include "sn.grafanaAlerting" . | nindent 2 }}
---
# Grafana with Loki, Tempo, Prometheus and an OpenTelemetry collector; the
# server sends its traces, metrics and logs to port 4318. Grafana takes the
# console member from the headers the forwardAuth answer sets (env/lgtm.env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "0" | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: lgtm }
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "lgtm") | nindent 8 }}
      annotations:
        # Grafana provisions alerting once, at start.
        checksum/alerting: {{ include "sn.grafanaAlerting" . | sha256sum | trunc 16 }}
        {{- if .Values.lgtm.clusterPrometheus }}
        checksum/datasources: {{ include "sn.grafanaDatasources" . | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      affinity:
        {{- include "sn.preferRole" "stateful" | nindent 8 }}
      containers:
        - name: lgtm
          image: {{ include "sn.image" .Values.images.lgtm }}
          env:
            - { name: GF_SERVER_ROOT_URL, value: "https://{{ include "sn.host" (dict "root" . "sub" "grafana") }}" }
            {{- range $k, $v := include "sn.envFile" (dict "root" . "file" "env/lgtm.env") | fromJson }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- if .Values.lgtm.telegram }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: grafana-secrets, key: TELEGRAM_BOT_TOKEN } }
            - name: TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: grafana-secrets, key: TELEGRAM_CHAT_ID } }
            {{- end }}
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /api/health, port: grafana }
          volumeMounts:
            - { name: data, mountPath: /data }
            - name: dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/shopnexus.yaml
              subPath: provider.yaml
            - { name: dashboards, mountPath: /otel-lgtm/shopnexus-dashboards, readOnly: true }
            - { name: alerting, mountPath: /otel-lgtm/grafana/conf/provisioning/alerting, readOnly: true }
            {{- if .Values.lgtm.clusterPrometheus }}
            - name: datasources
              mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/cluster.yaml
              subPath: cluster.yaml
            {{- end }}
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: lgtm }
        - name: dashboards
          configMap: { name: lgtm-dashboards }
        - name: alerting
          configMap: { name: lgtm-alerting }
        {{- if .Values.lgtm.clusterPrometheus }}
        - name: datasources
          configMap: { name: lgtm-datasources }
        {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "0" | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.lgtm.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: grafana }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
# pgweb on the stack's database as its owner, the dashboard db. It asks for
# no sign-in: the console's gate admits admins only, and the network
# policies let only Traefik reach it. --lock-session keeps it on this one
# database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "2" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pgweb }
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "pgweb") | nindent 8 }}
    spec:
      affinity:
        {{- include "sn.preferRole" "app" | nindent 8 }}
      containers:
        - name: pgweb
          image: {{ include "sn.image" .Values.images.pgweb }}
          args: [--bind=0.0.0.0, --listen=8081, --lock-session, --skip-open]
          env:
            - name: PGWEB_DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-app, key: uri } }
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            tcpSocket: { port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: pgweb }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
# The server answers 200 with the console member in X-Console-Email and
# X-Console-Role, or sends the browser to the console. Traefik copies only
# those two headers onto the request, replacing any the client sent.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://server-api.{{ $ns }}.svc:8080/v1/console/dashboard-auth
    authResponseHeaders: [X-Console-Email, X-Console-Role]
---
# Restate's admin UI and Argo CD live in other namespaces, which Traefik
# reaches with allowCrossNamespace (infra/cluster/k3d-*.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboards
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "2" | nindent 4 }}
spec:
  routes:
  {{- range include "sn.dashboards" . | fromJsonArray }}
    - kind: Rule
      match: Host(`{{ .host }}`) && PathPrefix(`/_dashboard`)
      services:
        - { name: server-api, port: 8080 }
    - kind: Rule
      match: Host(`{{ .host }}`)
      middlewares:
        - { name: dashboard-auth }
      services:
        - { name: {{ .service }}, namespace: {{ .namespace | default $ns }}, port: {{ .port }} }
  {{- end }}
