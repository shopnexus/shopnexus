{{- /* LiteLLM, the stack's door to the remote models: the server and the
       agent name an alias and hold a key of litellm/keys.txt. Its config is
       litellm/config.yaml and its shared settings env/litellm.env, which
       docker-compose.yml mounts and reads too. Its database is litellm in
       the stack's Postgres (postgres.yaml). */ -}}
{{- $l := .Values.litellm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels: {{- include "sn.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get "litellm/config.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "2" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: litellm }
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "litellm") | nindent 8 }}
      annotations:
        checksum/config: {{ print (.Files.Get "litellm/config.yaml") (.Files.Get "env/litellm.env") | sha256sum | trunc 16 }}
        checksum/secrets: {{ include "sn.secretsSum" . }}
    spec:
      affinity:
        {{- include "sn.preferRole" "app" | nindent 8 }}
      containers:
        - name: litellm
          image: {{ include "sn.image" .Values.images.litellm }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            # The admin UI's own sign-in, apart from the master key; the UI
            # sits behind the console's sign-in too (litellm.<domain>).
            - name: UI_USERNAME
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_UI_USERNAME } }
            - name: UI_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_UI_PASSWORD } }
            {{- /* env/litellm.env, then the upstream keys config.yaml names. */}}
            {{- range $k, $v := include "sn.envFile" (dict "root" . "file" "env/litellm.env") | fromJson }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $name := include "sn.litellmSecretEnv" . | fromJsonArray }}
            - name: {{ $name }}
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: {{ $name }} } }
            {{- end }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-db, key: password } }
            - name: DATABASE_URL
              value: postgresql://litellm:$(DB_PASSWORD)@postgres-rw:5432/litellm
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: litellm }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
{{- /* Makes each key of litellm/keys.txt exist with this stack's budget by
       running litellm/keys.sh sync, which docker-compose.yml runs too. A key
       calls only aliases of config.yaml that cost the same, and every key
       has its budget in litellm.keys. It runs once LiteLLM is up. */ -}}
{{- $costs := include "sn.litellmCosts" . | fromJson }}
{{- $keys := include "sn.litellmKeys" . | fromJsonArray }}
{{- $listed := dict }}
{{- range $k := $keys }}
{{- $_ := set $listed $k.alias true }}
{{- $seen := dict }}
{{- range $m := $k.allows }}
{{- if not (hasKey $costs $m) }}{{ fail (printf "litellm/keys.txt: %s names %s, which litellm/config.yaml does not have" $k.alias $m) }}{{ end }}
{{- $_ := set $seen (get $costs $m) true }}
{{- end }}
{{- if gt (len $seen) 1 }}{{ fail (printf "litellm/keys.txt: %s calls aliases with different costs" $k.alias) }}{{ end }}
{{- if not (get $l.keys $k.alias) }}{{ fail (printf "litellm.keys.%s is required: the key's budget" $k.alias) }}{{ end }}
{{- end }}
{{- range $name, $_ := $l.keys }}
{{- if not (hasKey $listed $name) }}{{ fail (printf "litellm.keys.%s is not a key of litellm/keys.txt" $name) }}{{ end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-keys
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "sn.wave" "3" | nindent 4 }}
data:
  keys.sh: |
    {{- .Files.Get "litellm/keys.sh" | nindent 4 }}
  keys.txt: |
    {{- .Files.Get "litellm/keys.txt" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-keys
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "sn.wave" "4" | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "litellm-keys") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keys
          image: {{ include "sn.image" .Values.images.curl }}
          command: [sh, /etc/keys/keys.sh, sync, /etc/keys/keys.txt]
          env:
            - { name: LITELLM_URL, value: "http://litellm:4000" }
            - name: MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            {{- range $k := $keys }}
            - name: {{ $k.var }}
              valueFrom: { secretKeyRef: { name: {{ $k.secret }}, key: {{ $k.var }} } }
            - { name: {{ include "sn.litellmLimitsEnv" $k.alias }}, value: {{ include "sn.litellmLimits" (dict "alias" $k.alias "k" (get $l.keys $k.alias)) | squote }} }
            {{- end }}
          volumeMounts:
            - { name: keys, mountPath: /etc/keys }
      volumes:
        - name: keys
          configMap: { name: litellm-keys }
