{{- /* The stack's LiteLLM: one model_list entry per litellm.aliases, priced so
       budgets count tokens or seconds. Its virtual keys are the Job in
       litellm-keys.yaml. */ -}}
{{- define "sn.litellmConfig" -}}
model_list:
{{- range $name, $a := .Values.litellm.aliases }}
  - model_name: {{ $name }}
    litellm_params:
      model: {{ required (printf "litellm.aliases.%s.model is required" $name) $a.model }}
      api_base: {{ required (printf "litellm.aliases.%s.apiBase is required" $name) $a.apiBase }}
      {{- if $a.apiKeySecret }}
      api_key: os.environ/{{ $a.apiKeySecret }}
      {{- else }}
      api_key: none   # a backend of the stack, which has no authentication
      {{- end }}
    model_info:
      {{- with $a.mode }}
      mode: {{ . }}
      {{- end }}
      {{- if eq $a.price "token" }}
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      {{- else if eq $a.price "second" }}
      input_cost_per_second: 0.000001
      {{- else }}
      {{- fail (printf "litellm.aliases.%s.price must be token or second" $name) }}
      {{- end }}
{{- end }}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # A search photo passes through here; the spend logs keep no bodies.
  store_prompts_in_spend_logs: false
litellm_settings:
  drop_params: true
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels: {{- include "sn.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "sn.litellmConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "2" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: litellm }
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "litellm") | nindent 8 }}
      annotations:
        checksum/config: {{ include "sn.litellmConfig" . | sha256sum | trunc 16 }}
        checksum/secrets: {{ include "sn.secretsSum" . }}
    spec:
      affinity:
        {{- include "sn.preferRole" "app" | nindent 8 }}
      containers:
        - name: litellm
          image: {{ include "sn.image" .Values.images.litellm }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } }
            {{- $seen := dict }}
            {{- range $name, $a := .Values.litellm.aliases }}
            {{- if and $a.apiKeySecret (not (hasKey $seen $a.apiKeySecret)) }}
            {{- $_ := set $seen $a.apiKeySecret true }}
            - name: {{ $a.apiKeySecret }}
              valueFrom: { secretKeyRef: { name: litellm-secrets, key: {{ $a.apiKeySecret }} } }
            {{- end }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-db, key: password } }
            - name: DATABASE_URL
              value: postgresql://litellm:$(DB_PASSWORD)@postgres-rw:5432/litellm
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: litellm-config }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: litellm }
  ports:
    - { name: http, port: 4000, targetPort: http }
