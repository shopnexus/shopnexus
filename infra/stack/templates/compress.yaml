# Text answers go out compressed (zstd, br or gzip, as the client asks).
# Photos and streams are already compressed or must not be buffered.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "1" | nindent 4 }}
spec:
  compress:
    includedContentTypes:
      - text/html
      - text/css
      - text/plain
      - text/javascript
      - application/javascript
      - application/json
      - application/problem+json
      - application/xml
      - application/manifest+json
      - image/svg+xml
