{{- $restate := include "sn.restate" . }}
# Ingress is denied unless a policy below admits it. Egress stays open: the
# server calls Firebase, FCM and the language model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Pods of this stack reach each other: server to postgres and rustfs, the
# jobs, postgres replication, imgproxy to rustfs. The server and the agent
# take only the ports to-server and to-agent open, and imgproxy only its
# cache. pgweb asks for no sign-in, so only Traefik, behind the console's
# gate, reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-stack
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: NotIn, values: [server, server-ai, agent, pgweb, imgproxy] }
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-traefik
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [website, docs, console, rustfs, lgtm, litellm, pgweb, imgproxy-cache] }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-cnpg
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: postgres }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
---
# Restate writes snapshots to rustfs; to-server lets it invoke the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-restate
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rustfs }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $restate }} }
---
# The server's three ports: the API (8080) from the stack and Traefik, the
# Restate endpoint (9080) from the stack and its Restate, and the MCP server
# (9090, AGENT_MCP_ADDR) from the agent only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-server
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: server }
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $restate }} }
      ports:
        - { protocol: TCP, port: 9080 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: agent }
      ports:
        - { protocol: TCP, port: 9090 }
---
# server-ai's Restate endpoint (9080) from the stack and its Restate; it
# serves no API beyond its probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-server-ai
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: server-ai }
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $restate }} }
      ports:
        - { protocol: TCP, port: 9080 }
---
# The agent takes requests from the server only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-agent
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: agent }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: server }
      ports:
        - { protocol: TCP, port: 3000 }
---
# imgproxy takes requests from its cache only, so every photo is resized
# once per format.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: to-imgproxy
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: imgproxy }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: imgproxy-cache }
      ports:
        - { protocol: TCP, port: 8080 }
