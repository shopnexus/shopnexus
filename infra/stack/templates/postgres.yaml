# CNPG reads the major version from the image tag, and ParadeDB's tags
# (0.26.4-pg18) do not parse, so a catalog states the major.
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: postgres
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "0" | nindent 4 }}
spec:
  images:
    - major: 18
      image: {{ include "sn.image" .Values.images.postgres }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "0" | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  # The ParadeDB image's postgres user; CNPG assumes 26, its own images' uid.
  postgresUID: 999
  postgresGID: 999
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgres
    major: 18
  postgresql:
    # pg_prewarm reloads the buffers it saved after a restart.
    shared_preload_libraries: [pg_search, pg_prewarm]
    parameters:
      shared_buffers: {{ .Values.postgres.sharedBuffers | quote }}
      effective_cache_size: {{ .Values.postgres.effectiveCacheSize | quote }}
      max_connections: {{ .Values.postgres.maxConnections | quote }}
      # A pg_stat_statements.* parameter makes CNPG preload the extension
      # and create it in every database, as compose's image already does.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: top
  managed:
    roles:
      # Bifrost keeps its config and logs in a database of its own.
      - name: bifrost
        ensure: present
        login: true
        passwordSecret: { name: bifrost-db }
  bootstrap:
    initdb:
      database: app
      owner: app
      # As the superuser, so the migration's CREATE EXTENSION finds it present.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_search CASCADE
  storage:
    size: {{ .Values.postgres.storage }}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bifrost
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "1" | nindent 4 }}
spec:
  name: bifrost
  owner: bifrost
  cluster: { name: postgres }
