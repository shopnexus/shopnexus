{{- /* SealedSecrets that infra/cmd/seal wrote for this stack. Without them the
       stack cannot start, so the render stops and says what to run. */ -}}
{{- $files := .Files.Glob (printf "%s/%s/*.yaml" .Values.secretsDir .Values.stack) }}
{{- if not $files }}{{ fail (printf "infra/stack/%s/%s/ holds no sealed secrets: run go -C infra run ./cmd/seal %s, commit and push" .Values.secretsDir .Values.stack .Values.stack) }}{{ end }}
{{- range $path, $_ := $files }}
---
{{ $.Files.Get $path }}
{{- end }}
