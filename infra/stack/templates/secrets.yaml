{{- /* SealedSecrets that seal.sh wrote for this stack. Without them the
       stack cannot start, so the render stops and says what to run. */ -}}
{{- $files := .Files.Glob (printf "secrets/%s/*.yaml" .Values.stack) }}
{{- if not $files }}{{ fail (printf "infra/stack/secrets/%s/ holds no sealed secrets: run infra/cluster/seal.sh %s, commit and push" .Values.stack .Values.stack) }}{{ end }}
{{- range $path, $_ := $files }}
---
{{ $.Files.Get $path }}
{{- end }}
