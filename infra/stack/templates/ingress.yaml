{{- /* Hosts only. TLS belongs to the edge: Traefik's websecure entrypoint
       in direct mode, the outer proxy in behind-proxy mode. The console,
       an admin app, has its own Ingress with noindex. */ -}}
{{- $d := required "domain is required" .Values.domain }}
{{- $routes := list (list "" "website" 3000) (list "api" "server-api" 8080) (list "media" "rustfs" 9000) (list "docs" "docs" 80) }}
{{- $mw := printf "%[1]s-compress@kubernetescrd,%[1]s-security-headers@kubernetescrd" .Release.Namespace }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnexus
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations:
    {{- include "sn.wave" "2" | nindent 4 }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}
spec:
  ingressClassName: traefik
  rules: {{- include "sn.ingressRules" (dict "routes" $routes "domain" $d) | trim | nindent 4 }}
{{- if .Values.console.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations:
    {{- include "sn.wave" "2" | nindent 4 }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }},{{ .Release.Namespace }}-noindex@kubernetescrd
spec:
  ingressClassName: traefik
  rules: {{- include "sn.ingressRules" (dict "routes" (list (list "console" "console" (int .Values.console.port))) "domain" $d) | trim | nindent 4 }}
{{- end }}
