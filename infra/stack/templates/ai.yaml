{{- /* The stack's provider of self-hosted models (repo shopnexus/ai). LiteLLM's
       aliases stt and embed-image call it, and the server calls its frames
       route; from-stack lets both in, and it has no Ingress. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "2" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai }
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "ai") | nindent 8 }}
    spec:
      affinity:
        {{- include "sn.preferRole" "app" | nindent 8 }}
      containers:
        - name: ai
          image: {{ include "sn.image" .Values.images.ai }}
          env:
            - { name: AI_ADDR, value: ":8000" }
            - { name: AI_STT_MODELS, value: gipformer-1.5=/models/gipformer-1.5 }
            - { name: AI_VAD_MODEL, value: /models/silero_vad.onnx }
            - { name: AI_NUM_THREADS, value: {{ required "ai.numThreads is required" .Values.ai.numThreads | toString | quote }} }
            - { name: AI_MAX_CONCURRENT, value: {{ required "ai.maxConcurrent is required" .Values.ai.maxConcurrent | toString | quote }} }
            - { name: AI_MAX_UPLOAD_MB, value: {{ required "ai.maxUploadMB is required" .Values.ai.maxUploadMB | toString | quote }} }
            - { name: AI_MAX_AUDIO_SECONDS, value: {{ required "ai.maxAudioSeconds is required" .Values.ai.maxAudioSeconds | toString | quote }} }
            - { name: AI_EMBED_MODELS, value: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384 }
            - { name: AI_EMBED_MAX_INPUTS, value: {{ required "ai.embedMaxInputs is required" .Values.ai.embedMaxInputs | toString | quote }} }
            - { name: AI_EMBED_MAX_CONCURRENT, value: {{ required "ai.embedMaxConcurrent is required" .Values.ai.embedMaxConcurrent | toString | quote }} }
            - { name: AI_EMBED_MAX_IMAGE_MB, value: {{ required "ai.embedMaxImageMB is required" .Values.ai.embedMaxImageMB | toString | quote }} }
            - { name: AI_FRAMES_MAX_CONCURRENT, value: {{ required "ai.framesMaxConcurrent is required" .Values.ai.framesMaxConcurrent | toString | quote }} }
            - { name: AI_FRAMES_MAX_SECONDS, value: {{ required "ai.framesMaxSeconds is required" .Values.ai.framesMaxSeconds | toString | quote }} }
            - { name: AI_FRAMES_MIN_SHARPNESS, value: {{ required "ai.framesMinSharpness is required" .Values.ai.framesMinSharpness | toString | quote }} }
          ports:
            - { name: http, containerPort: 8000 }
          # Loading the models takes seconds to a minute, and the server listens after it.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: {{ div (required "ai.startupSeconds is required" .Values.ai.startupSeconds) 2 }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # Uploads wait in /tmp while they decode.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "1", memory: {{ required "ai.memoryRequest is required" .Values.ai.memoryRequest }} }
            limits: { memory: {{ required "ai.memoryLimit is required" .Values.ai.memoryLimit }} }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  labels: {{- include "sn.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: ai }
  ports:
    - { name: http, port: 8000, targetPort: http }
