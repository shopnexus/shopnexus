{{- /* Sync hooks in wave 1: after postgres and rustfs (wave 0) are healthy,
       before the server (wave 2). Each sync runs them again; all of them are
       idempotent. The objectstore-init jobs work with RustFS's root keys and
       give each bucket's user (the server's, Restate's, the agent
       runtime's) that bucket only. */ -}}
{{- $root := list
  (dict "name" "OBJECT_STORE_ROOT_ACCESS_KEY" "secret" "rustfs-secrets" "key" "RUSTFS_ACCESS_KEY")
  (dict "name" "OBJECT_STORE_ROOT_SECRET_KEY" "secret" "rustfs-secrets" "key" "RUSTFS_SECRET_KEY") }}
{{- $snapshots := list
  (dict "name" "OBJECT_STORE_BUCKET" "value" "restate-snapshots")
  (dict "name" "OBJECT_STORE_ACCESS_KEY" "secret" "rustfs-secrets" "key" "SNAPSHOTS_ACCESS_KEY")
  (dict "name" "OBJECT_STORE_SECRET_KEY" "secret" "rustfs-secrets" "key" "SNAPSHOTS_SECRET_KEY") }}
{{- $jobs := list
  (dict "name" "migrate" "command" "/migrate" "env" (list))
  (dict "name" "objectstore-init" "command" "/objectstore-init" "env" $root)
  (dict "name" "objectstore-init-snapshots" "command" "/objectstore-init" "env" (concat $root $snapshots)) }}
{{- /* The agent runtime's workspaces: the bucket, its user, and the rule
       that removes a workspace WORKSPACE_EXPIRE_DAYS after its last turn,
       both from env/agent-runtime.env. */ -}}
{{- if .Values.agentRuntime.enabled }}
{{- $agent := include "sn.envFile" (dict "root" . "file" "env/agent-runtime.env") | fromJson }}
{{- $workspaces := list
  (dict "name" "OBJECT_STORE_BUCKET" "value" $agent.WORKSPACE_BUCKET)
  (dict "name" "OBJECT_STORE_EXPIRE_DAYS" "value" $agent.WORKSPACE_EXPIRE_DAYS)
  (dict "name" "OBJECT_STORE_ACCESS_KEY" "secret" "rustfs-secrets" "key" "AGENT_WORKSPACES_ACCESS_KEY")
  (dict "name" "OBJECT_STORE_SECRET_KEY" "secret" "rustfs-secrets" "key" "AGENT_WORKSPACES_SECRET_KEY") }}
{{- $jobs = append $jobs (dict "name" "objectstore-init-agent-workspaces" "command" "/objectstore-init" "env" (concat $root $workspaces)) }}
{{- end }}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  labels: {{- include "sn.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "sn.wave" "1" | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" $ "name" .name) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .name }}
          image: {{ include "sn.image" $.Values.images.server }}
          command: [{{ .command | quote }}]
          {{- include "sn.serverEnv" $ | nindent 10 }}
          {{- range .env }}
            {{- if .secret }}
            - name: {{ .name }}
              valueFrom: { secretKeyRef: { name: {{ .secret }}, key: {{ .key }} } }
            {{- else }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
          {{- end }}
{{- end }}
