{{- /* Sync hooks in wave 1: after postgres and rustfs (wave 0) are healthy,
       before the server (wave 2). Each sync runs them again; all three are
       idempotent. */ -}}
{{- $jobs := list
  (dict "name" "migrate" "command" "/migrate" "env" (list))
  (dict "name" "objectstore-init" "command" "/objectstore-init" "env" (list))
  (dict "name" "objectstore-init-snapshots" "command" "/objectstore-init" "env" (list (dict "name" "OBJECT_STORE_BUCKET" "value" "restate-snapshots"))) }}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  labels: {{- include "sn.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "sn.wave" "1" | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" $ "name" .name) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .name }}
          image: {{ include "sn.image" $.Values.images.server }}
          command: [{{ .command | quote }}]
          {{- include "sn.serverEnv" $ | nindent 10 }}
          {{- range .env }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
          {{- end }}
{{- end }}
---
# pgweb's role reads and writes the rows of the app database's tables and
# changes nothing else: it owns no table, so it cannot drop, alter or
# truncate one. The console's tables and schema_migrations are read-only to
# it. After migrate (wave 1), as app, the tables' owner; each sync runs it
# again, and the default privileges cover the tables later migrations add.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgweb-grants
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations: {{- include "sn.wave" "0" | nindent 4 }}
data:
  grants.sql: |
    \set ON_ERROR_STOP on
    BEGIN;
    REVOKE ALL ON ALL TABLES IN SCHEMA public FROM pgweb;
    GRANT USAGE ON SCHEMA public TO pgweb;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO pgweb;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO pgweb;
    DO $$
    DECLARE t text;
    BEGIN
      FOR t IN SELECT tablename FROM pg_tables
               WHERE schemaname = 'public' AND (tablename LIKE 'console\_%' OR tablename = 'schema_migrations')
      LOOP
        EXECUTE format('REVOKE INSERT, UPDATE, DELETE ON public.%I FROM pgweb', t);
      END LOOP;
    END $$;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO pgweb;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO pgweb;
    COMMIT;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pgweb-grants
  labels: {{- include "sn.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "sn.wave" "2" | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "sn.podLabels" (dict "root" . "name" "pgweb-grants") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pgweb-grants
          image: {{ include "sn.image" .Values.images.postgres }}
          command: [psql, "$(DATABASE_URL)", -f, /sql/grants.sql]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-app, key: uri } }
          volumeMounts:
            - { name: sql, mountPath: /sql }
      volumes:
        - name: sql
          configMap: { name: pgweb-grants }
