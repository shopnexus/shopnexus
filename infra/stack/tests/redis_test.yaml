suite: redis
templates: [redis.yaml]
release: { namespace: shopnexus-prod }
values: [../values-prod.yaml, values-test.yaml]
tests:
  # docker-compose.yml's x-redis runs the same image and arguments.
  - it: runs the pinned Redis in wave 0 with an append-only file on its own volume
    documentIndex: 0
    asserts:
      - isKind: { of: StatefulSet }
      - equal: { path: metadata.name, value: redis }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "0" }
      - equal: { path: 'spec.template.spec.containers[0].image', value: "redis:7.4.12-alpine" }
      - equal:
          path: spec.template.spec.containers[0].args
          value: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, volatile-lru]
      - equal: { path: 'spec.template.spec.containers[0].volumeMounts[0]', value: { name: data, mountPath: /data } }
      - equal: { path: 'spec.volumeClaimTemplates[0].spec.resources.requests.storage', value: 1Gi }
  - it: is reachable in the stack as redis:6379, the host of REDIS_URL
    documentIndex: 1
    asserts:
      - isKind: { of: Service }
      - equal: { path: metadata.name, value: redis }
      - equal: { path: 'spec.ports[0].port', value: 6379 }
