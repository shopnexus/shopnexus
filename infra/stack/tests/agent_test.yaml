suite: agent runtime and package-proxy
templates: [agent.yaml, package-proxy.yaml, jobs.yaml]
release: { namespace: shopnexus-dev }
values: [../values-dev.yaml, values-test.yaml]
set: { agent.enabled: true }
tests:
  - it: renders nothing until agent.enabled
    set: { agent.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
        template: agent.yaml
      - hasDocuments: { count: 0 }
        template: package-proxy.yaml
      - hasDocuments: { count: 3 }
        template: jobs.yaml
  - it: runs one pod that stops before the next starts, since a conversation's lock is in the process
    template: agent.yaml
    documentIndex: 0
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: spec.replicas, value: 1 }
      - equal: { path: spec.strategy.type, value: Recreate }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "2" }
      - equal: { path: 'spec.template.spec.containers[0].image', value: ghcr.io/shopnexus/agent:main }
      - equal: { path: spec.template.spec.terminationGracePeriodSeconds, value: 300 }
  # bwrap needs user namespaces (the Localhost seccomp profile) and a fresh
  # /proc (Unmasked, which needs the pod's own user namespace).
  - it: gives bubblewrap what it needs and nothing more
    template: agent.yaml
    documentIndex: 0
    asserts:
      - equal: { path: spec.template.spec.hostUsers, value: false }
      - equal:
          path: spec.template.spec.securityContext.seccompProfile
          value: { type: Localhost, localhostProfile: shopnexus-dev/agent.json }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 10001 }
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value: { procMount: Unmasked, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
  - it: reads env/agent.env, its Garage address and its keys from agent-secrets
    template: agent.yaml
    documentIndex: 0
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: S3_ENDPOINT, value: "garage:3900" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: MODEL_BASE_URL, value: http://bifrost:8080/v1 } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: PACKAGE_PROXY, value: "package-proxy:8080" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: WORKSPACE_BUCKET, value: agent-workspaces } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AGENT_KEY, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_KEY } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_WORKSPACES_ACCESS_KEY } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_WORKSPACES_SECRET_KEY } } }
  - it: puts the seccomp profile on every node, under the namespace the pod names, before the runtime starts
    template: agent.yaml
    asserts:
      - exists: { path: 'data["agent.json"]' }
        documentSelector: { path: kind, value: ConfigMap }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1" }
        documentSelector: { path: kind, value: DaemonSet }
      - contains: { path: spec.template.spec.volumes, content: { name: host, hostPath: { path: /var/lib/kubelet/seccomp, type: DirectoryOrCreate } } }
        documentSelector: { path: kind, value: DaemonSet }
      - matchRegex: { path: 'spec.template.spec.containers[0].command[2]', pattern: 'mv \S+ /host/shopnexus-dev/agent\.json\n' }
        documentSelector: { path: kind, value: DaemonSet }
  - it: makes the workspaces bucket, its key and its expiry through Garage's admin API, off the web endpoint
    template: jobs.yaml
    documentSelector: { path: metadata.name, value: objectstore-init-agent-workspaces }
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].command[0]', value: /objectstore-init }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: OBJECT_STORE_BUCKET, value: agent-workspaces } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: OBJECT_STORE_EXPIRE_DAYS, value: "7" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: OBJECT_STORE_WEBSITE, value: "false" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: OBJECT_STORE_ADMIN_ENDPOINT, value: "http://garage:3903" } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: OBJECT_STORE_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: garage-secrets, key: GARAGE_ADMIN_TOKEN } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: OBJECT_STORE_ACCESS_KEY, valueFrom: { secretKeyRef: { name: garage-secrets, key: AGENT_WORKSPACES_ACCESS_KEY } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: OBJECT_STORE_SECRET_KEY, valueFrom: { secretKeyRef: { name: garage-secrets, key: AGENT_WORKSPACES_SECRET_KEY } } }
  - it: runs package-proxy with the shared config, as its image's user
    template: package-proxy.yaml
    asserts:
      - exists: { path: 'data["config.yaml"]' }
        documentSelector: { path: kind, value: ConfigMap }
      - equal: { path: 'spec.template.spec.containers[0].image', value: "ghcr.io/git-pkgs/proxy:v0.11.0" }
        documentSelector: { path: kind, value: Deployment }
      - equal: { path: 'spec.template.spec.containers[0].args', value: [-config, /etc/proxy/config.yaml] }
        documentSelector: { path: kind, value: Deployment }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 1000 }
        documentSelector: { path: kind, value: Deployment }
      - equal: { path: 'spec.ports[0].port', value: 8080 }
        documentSelector: { path: kind, value: Service }
