suite: agent
templates: [agent.yaml, server.yaml]
release: { namespace: shopnexus-prod }
tests:
  - it: runs the pinned image in prod in wave 2, as a non-root user
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "2" }
      - equal: { path: spec.replicas, value: 1 }
      - matchRegex: { path: 'spec.template.spec.containers[0].image', pattern: '^ghcr.io/shopnexus/agent(:[0-9]+\.[0-9]+\.[0-9]+|@sha256:[0-9a-f]{64})$' }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 1000 }
      - exists: { path: 'spec.template.metadata.annotations["checksum/secrets"]' }
  - it: follows main in dev
    template: agent.yaml
    documentIndex: 0
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].image', value: ghcr.io/shopnexus/agent:main }
  - it: has no init container, since the agent keeps no state
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - notExists: { path: spec.template.spec.initContainers }
  - it: calls Bifrost and the server's MCP
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: PORT, value: "3000" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: GATEWAY_BASE_URL, value: http://bifrost:8080/v1 } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: MCP_SERVER_URL, value: http://server-mcp:9090/mcp } }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: AGENT_MODEL_ID, value: console-agent } }
  - it: takes the two tokens from agent-secrets, and no gateway key
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AGENT_SERVICE_TOKEN, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_SERVICE_TOKEN } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AGENT_MCP_TOKEN, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_MCP_TOKEN } } }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: LITELLM_API_KEY, valueFrom: { secretKeyRef: { name: agent-secrets, key: AGENT_LLM_API_KEY } } }
  # env/agent.env, the two tokens and the MCP URL.
  - it: sets the agent's settings
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - lengthEqual: { path: 'spec.template.spec.containers[0].env', count: 14 }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: AGENT_TURN_DEADLINE_MS, value: "60000" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: AGENT_MAX_TURNS, value: "0" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: FEATURE_ALL_AGENT, value: "true" } }
  # env/agent.env, which compose reads too, holds the shared settings.
  - it: takes the shared settings from env/agent.env
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AGENT_TURN_DEADLINE_MS, value: "60000" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: AGENT_HISTORY_CHARS, value: "60000" }
  - it: probes /healthz
    template: agent.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /healthz }
      - equal: { path: 'spec.template.spec.containers[0].livenessProbe.httpGet.path', value: /healthz }
  - it: is reachable in the stack as agent:3000, the address the server calls
    template: agent.yaml
    documentIndex: 1
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind: { of: Service }
      - equal: { path: metadata.name, value: agent }
      - equal: { path: 'spec.ports[0].port', value: 3000 }
  - it: serves the server's MCP as server-mcp:9090, the port of AGENT_MCP_ADDR
    template: server.yaml
    documentIndex: 3
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind: { of: Service }
      - equal: { path: metadata.name, value: server-mcp }
      - equal: { path: 'spec.selector["app.kubernetes.io/name"]', value: server }
      - matchRegex: { path: 'spec.selector["shopnexus.id.vn/version"]', pattern: '^[0-9a-f]{16}$' }
      - equal: { path: 'spec.ports[0]', value: { name: mcp, port: 9090, targetPort: mcp } }
  - it: opens the MCP port on the server pods
    template: server.yaml
    documentIndex: 1
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].ports', content: { name: mcp, containerPort: 9090 } }
