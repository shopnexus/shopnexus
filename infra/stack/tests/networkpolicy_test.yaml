suite: network policies
templates: [networkpolicy.yaml]
release: { namespace: shopnexus-prod }
values: [../values-prod.yaml, values-test.yaml]
tests:
  - it: denies ingress by default and opens it to five sources and four services
    asserts:
      - hasDocuments:
          count: 9
      - equal:
          path: metadata.name
          value: default-deny-ingress
        documentIndex: 0
      - equal:
          path: metadata.name
          value: from-stack
        documentIndex: 1
      - equal:
          path: metadata.name
          value: from-traefik
        documentIndex: 2
      - equal:
          path: metadata.name
          value: from-cnpg
        documentIndex: 3
      - equal:
          path: metadata.name
          value: from-restate
        documentIndex: 4
      - equal:
          path: metadata.name
          value: to-server
        documentIndex: 5
      - equal:
          path: metadata.name
          value: to-server-ai
        documentIndex: 6
      - equal:
          path: metadata.name
          value: to-agent
        documentIndex: 7
      - equal:
          path: metadata.name
          value: to-redis
        documentIndex: 8
  - it: admits the stack's Restate namespace to rustfs
    documentSelector: { path: metadata.name, value: from-restate }
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: restate-prod
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/name"]', value: rustfs }
  # The server and the agent are left to to-server and to-agent, which open
  # each port to its callers only.
  - it: leaves the server, the agent, pgweb and Redis out of from-stack, and the server out of from-traefik
    asserts:
      - equal:
          path: spec.podSelector.matchExpressions[0]
          value: { key: app.kubernetes.io/name, operator: NotIn, values: [server, server-ai, agent, pgweb, redis] }
        documentSelector: { path: metadata.name, value: from-stack }
      - notContains: { path: 'spec.podSelector.matchExpressions[0].values', content: server }
        documentSelector: { path: metadata.name, value: from-traefik }
  - it: opens the server's API to the stack and Traefik, its Restate endpoint to Restate
    documentSelector: { path: metadata.name, value: to-server }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/name"]', value: server }
      - lengthEqual: { path: spec.ingress, count: 3 }
      - equal: { path: 'spec.ingress[0].ports', value: [{ protocol: TCP, port: 8080 }] }
      - equal: { path: 'spec.ingress[0].from[1].podSelector.matchLabels["app.kubernetes.io/name"]', value: traefik }
      - equal: { path: 'spec.ingress[1].ports', value: [{ protocol: TCP, port: 9080 }] }
      - equal:
          path: spec.ingress[1].from[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: restate-prod
  - it: opens the server's MCP port to the agent only
    documentSelector: { path: metadata.name, value: to-server }
    asserts:
      - equal: { path: 'spec.ingress[2].ports', value: [{ protocol: TCP, port: 9090 }] }
      - equal:
          path: spec.ingress[2].from
          value: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agent } } }]
  - it: opens the agent's port to the server only
    documentSelector: { path: metadata.name, value: to-agent }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/name"]', value: agent }
      - equal:
          path: spec.ingress
          value: [{ from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: server } } }], ports: [{ protocol: TCP, port: 3000 }] }]
  - it: opens Redis to the agent only
    documentSelector: { path: metadata.name, value: to-redis }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/name"]', value: redis }
      - equal:
          path: spec.ingress
          value: [{ from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: agent } } }], ports: [{ protocol: TCP, port: 6379 }] }]
      - notContains: { path: 'spec.podSelector.matchExpressions[0].values', content: redis }
        documentSelector: { path: metadata.name, value: from-traefik }
  - it: admits pods of this namespace only
    documentSelector: { path: metadata.name, value: from-stack }
    asserts:
      - notExists:
          path: spec.ingress[0].from[0].namespaceSelector
  # ai-models is reached by LiteLLM and the server only: from-stack admits
  # it, Traefik does not. Traefik reaches LiteLLM for its dashboard.
  - it: keeps Traefik away from ai-models
    documentIndex: 2
    asserts:
      - notContains: { path: 'spec.podSelector.matchExpressions[0].values', content: ai-models }
      - contains: { path: 'spec.podSelector.matchExpressions[0].values', content: litellm }
  # server-ai serves Restate only: from the stack and the stack's Restate.
  - it: admits the stack's Restate namespace to server-ai's 9080
    documentSelector: { path: metadata.name, value: to-server-ai }
    asserts:
      - equal: { path: 'spec.podSelector.matchLabels["app.kubernetes.io/name"]', value: server-ai }
      - equal:
          path: spec.ingress[0].from[1].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: restate-prod
      - equal: { path: 'spec.ingress[0].ports[0].port', value: 9080 }
