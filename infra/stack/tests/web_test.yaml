suite: web apps and ingress
templates: [web.yaml, ingress.yaml, compress.yaml, security-headers.yaml]
release: { namespace: shopnexus-prod }
tests:
  - it: serves the prod hosts, each to its Service
    template: ingress.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 5
      - equal:
          path: spec.rules[0].host
          value: shopnexus.id.vn
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: website
      - equal:
          path: spec.rules[1].host
          value: api.shopnexus.id.vn
      - equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: server-api
      - equal:
          path: spec.rules[2].host
          value: media.shopnexus.id.vn
      - equal:
          path: spec.rules[3].host
          value: docs.shopnexus.id.vn
      - equal:
          path: spec.rules[4].host
          value: console.shopnexus.id.vn
      - equal:
          path: spec.rules[4].http.paths[0].backend.service.name
          value: console
  - it: serves the dev hosts
    template: ingress.yaml
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal:
          path: spec.rules[0].host
          value: dev.shopnexus.id.vn
      - equal:
          path: spec.rules[1].host
          value: api.dev.shopnexus.id.vn
      - equal:
          path: spec.rules[2].host
          value: media.dev.shopnexus.id.vn
      - equal:
          path: spec.rules[3].host
          value: docs.dev.shopnexus.id.vn
      - equal:
          path: spec.rules[4].host
          value: console.dev.shopnexus.id.vn
  - it: sends the main host's /_img to the photo cache, the rest to the website
    template: ingress.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - lengthEqual: { path: 'spec.rules[0].http.paths', count: 2 }
      - equal:
          path: spec.rules[0].http.paths[0]
          value: { path: /_img, pathType: Prefix, backend: { service: { name: imgproxy-cache, port: { number: 80 } } } }
      - equal: { path: 'spec.rules[0].http.paths[1].path', value: / }
      - equal: { path: 'spec.rules[0].http.paths[1].backend.service.name', value: website }
      - lengthEqual: { path: 'spec.rules[1].http.paths', count: 1 }
  - it: leaves TLS to the edge
    template: ingress.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - notExists:
          path: spec.tls
  - it: runs two prod website pods and one in dev
    template: web.yaml
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: website
      - equal:
          path: spec.replicas
          value: 2
  - it: runs one dev website pod
    template: web.yaml
    documentIndex: 0
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: runs the prod docs and console from release tags
    template: web.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr.io/shopnexus/docs:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 2
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr.io/shopnexus/console:[0-9]+\.[0-9]+\.[0-9]+$'
        documentIndex: 4
  - it: runs the dev console from main
    template: web.yaml
    documentIndex: 4
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/shopnexus/console:main
  - it: keeps a browser on one website pod
    template: web.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      # web.yaml renders each app's Deployment, then its Service.
      - isKind: { of: Service }
        documentIndex: 1
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/service.sticky.cookie"]
          value: "true"
        documentIndex: 1
      - isKind: { of: Service }
        documentIndex: 3
      - notExists:
          path: metadata.annotations
        documentIndex: 3
  - it: compresses text answers and adds the security headers on every host
    template: ingress.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: shopnexus-prod-compress@kubernetescrd,shopnexus-prod-security-headers@kubernetescrd
  - it: compresses text, not photos
    template: compress.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind: { of: Middleware }
      - contains: { path: spec.compress.includedContentTypes, content: text/html }
      - notContains: { path: spec.compress.includedContentTypes, content: image/jpeg }
  - it: asks for HTTPS for a year and no content type sniffing
    template: security-headers.yaml
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind: { of: Middleware }
      - equal: { path: spec.headers.stsSeconds, value: 31536000 }
      - equal: { path: spec.headers.contentTypeNosniff, value: true }
