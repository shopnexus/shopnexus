suite: the server's configuration
templates: [server.yaml]
release: { namespace: shopnexus-prod }
tests:
  - it: sets the prod values
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.APP_ENV
          value: prod
      # restate-operator registers each version.
      - equal:
          path: data.RESTATE_REGISTER
          value: "false"
      - equal:
          path: data.PNV_TEST_NUMBERS
          value: "false"
      - equal:
          path: data.EMAIL_SENDER
          value: resend
      - equal:
          path: data.CONSOLE_ORIGIN
          value: https://console.shopnexus.id.vn
      - equal:
          path: data.DOCS_ORIGINS
          value: https://docs.shopnexus.id.vn,https://shopnexus.github.io
      - equal:
          path: data.WEBSITE_ORIGINS
          value: https://shopnexus.id.vn
      # The server reaches models only through the stack's LiteLLM, under one alias.
      - equal:
          path: data.LLM_BASE_URL
          value: http://litellm:4000/v1
      - equal:
          path: data.LLM_MODEL
          value: search
  - it: sets the dev values
    documentIndex: 0
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal:
          path: data.MEDIA_PUBLIC_URL
          value: https://media.shopnexus.id.vn/shopnexus
      - equal:
          path: data.RESTATE_INGRESS_URL
          value: http://restate.restate-dev:8080
      - equal:
          path: data.DOCS_ORIGINS
          value: https://docs.shopnexus.id.vn,https://docs.dev.shopnexus.id.vn,http://localhost:4321
      - equal:
          path: data.WEBSITE_ORIGINS
          value: https://shopnexus.id.vn,https://dev.shopnexus.id.vn,http://localhost:4321
  # config.Load reads every variable below. The rest come from server-secrets,
  # which infra/cmd/seal writes, and DATABASE_URL from CloudNativePG's secret.
  - it: sets every variable config.Load reads that is not a secret
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - exists: { path: data.APP_ENV }
      - exists: { path: data.HTTP_ADDR }
      - exists: { path: data.LOG_LEVEL }
      - exists: { path: data.LOG_FORMAT }
      - exists: { path: data.RESTATE_INGRESS_URL }
      - exists: { path: data.RESTATE_ADMIN_URL }
      - exists: { path: data.RESTATE_LISTEN_ADDR }
      - exists: { path: data.RESTATE_ENDPOINT_URL }
      - exists: { path: data.RESTATE_SERVICE_PREFIX }
      - exists: { path: data.RESTATE_REGISTER }
      - exists: { path: data.JWT_PREVIOUS_KEY_ID }
      - exists: { path: data.JWT_PREVIOUS_PUBLIC_KEY }
      - exists: { path: data.JWT_ISSUER }
      - exists: { path: data.JWT_AUDIENCE }
      - exists: { path: data.CONSOLE_ORIGIN }
      - exists: { path: data.OBJECT_STORE_ENDPOINT }
      - exists: { path: data.OBJECT_STORE_PUBLIC_ENDPOINT }
      - exists: { path: data.OBJECT_STORE_REGION }
      - exists: { path: data.OBJECT_STORE_BUCKET }
      - exists: { path: data.MEDIA_PUBLIC_URL }
      - exists: { path: data.FIREBASE_PROJECT_ID }
      - exists: { path: data.FIREBASE_PROJECT_NUMBER }
      - exists: { path: data.FIREBASE_AUTH_JWKS_URL }
      - exists: { path: data.PNV_JWKS_URL }
      - exists: { path: data.PNV_TEST_NUMBERS }
      - exists: { path: data.EMAIL_FROM }
      - exists: { path: data.GOOGLE_CLIENT_ID }
      - exists: { path: data.GOOGLE_JWKS_URL }
      - exists: { path: data.LLM_BASE_URL }
      - exists: { path: data.LLM_MODEL }
      - exists: { path: data.AI_STT_MODELS }
      - exists: { path: data.AI_VAD_MODEL }
      - exists: { path: data.AI_FRAMES_MAX_SECONDS }
      - exists: { path: data.ASSIST_LLM_BASE_URL }
      - exists: { path: data.ASSIST_LLM_MODEL }
      - exists: { path: data.ASSIST_LLM_REASONING_EFFORT }
      - exists: { path: data.ASSIST_CALL_TIMEOUT }
      - exists: { path: data.CHOTOT_GATEWAY_URL }
      - exists: { path: data.CHOTOT_CDN_URL }
      - exists: { path: data.TRUST_LLM_BASE_URL }
      - exists: { path: data.TRUST_LLM_MODEL }
      - exists: { path: data.TRUST_CALL_TIMEOUT }
      - exists: { path: data.AGENT_BASE_URL }
      - exists: { path: data.LITELLM_URL }
      - exists: { path: data.AGENT_MCP_ADDR }
      - exists: { path: data.CARRIER }
      - exists: { path: data.CARRIER_POLL_EVERY }
      - exists: { path: data.GHTK_API_URL }
      - exists: { path: data.GHTK_PARTNER_TOKEN }
      - exists: { path: data.GHTK_CLIENT_SOURCE }
      - exists: { path: data.GHTK_WEBHOOK_SECRET }
      - exists: { path: data.GHN_API_URL }
      - exists: { path: data.GHN_WEBHOOK_SECRET }
      - exists: { path: data.OTEL_EXPORTER_OTLP_ENDPOINT }
      - exists: { path: data.SERVICE_NAME }
      - exists: { path: data.TRUSTED_PROXIES }
      - exists: { path: data.DASHBOARD_HOSTS }
      - exists: { path: data.DOCS_ORIGINS }
      - exists: { path: data.WEBSITE_ORIGINS }
  # checksum/env is a hash of the ConfigMap's data. A change to it makes a new
  # server version. The value below is the hash of the prod data.
  - it: carries the hash of the configuration
    documentIndex: 1
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/env"]
          value: b86407dbd18ded6c
  - it: rolls the server when the configuration changes
    documentIndex: 1
    values: [../values-prod.yaml, values-test.yaml]
    set: { server.logLevel: debug }
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/env"]
          value: b86407dbd18ded6c
  # The console's AI settings call LiteLLM's admin API with the master key
  # LiteLLM itself reads.
  - it: reaches LiteLLM's admin API with its master key
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.LITELLM_URL, value: http://litellm:4000 }
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: LITELLM_MASTER_KEY, valueFrom: { secretKeyRef: { name: litellm-secrets, key: LITELLM_MASTER_KEY } } }
        documentIndex: 1
  # Text vectors come from LiteLLM's alias embed-text and photo vectors from
  # module ai's SigLIP 2; each model's version is stored with its vectors.
  - it: sets the embedding settings
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.EMBED_TEXT_BASE_URL, value: http://litellm:4000/v1 }
      - equal: { path: data.EMBED_TEXT_MODEL, value: embed-text }
      - equal: { path: data.AI_EMBED_MODELS, value: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384 }
      - equal: { path: data.EMBED_TEXT_VERSION, value: bge-m3@5617a9f61b028005a4858fdac845db406aefb181 }
      - equal: { path: data.EMBED_IMAGE_VERSION, value: siglip2-so400m-patch16-384@29f74e673c298fd07482d8e20138179282001eb7-fp32 }
      - equal: { path: data.EMBED_TIMEOUT, value: 15s }
      - equal: { path: data.EMBED_SLOTS, value: "2" }
      - equal: { path: data.EMBED_TEXT_MIN_SIMILARITY, value: "0.45" }
      - equal: { path: data.EMBED_PHOTO_MIN_SIMILARITY, value: "0.6" }
  # A video read cuts frames and transcribes in module ai, from the model
  # files under /models, and fills the listing through LiteLLM's alias.
  - it: sets the video read settings
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.AI_STT_MODELS, value: gipformer-1.5=/models/gipformer-1.5 }
      - equal: { path: data.AI_VAD_MODEL, value: /models/silero_vad.onnx }
      - equal: { path: data.ASSIST_LLM_BASE_URL, value: http://litellm:4000/v1 }
      - equal: { path: data.ASSIST_LLM_MODEL, value: listing-read }
      - equal: { path: data.ASSIST_LLM_REASONING_EFFORT, value: none }
      - equal: { path: data.ASSIST_CALL_TIMEOUT, value: 30s }
      - equal: { path: data.CHOTOT_GATEWAY_URL, value: https://gateway.chotot.com }
      - equal: { path: data.CHOTOT_CDN_URL, value: https://cdn.chotot.com }
  # A scam check calls the model through LiteLLM's alias scam-check.
  - it: sets the scam check settings
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.TRUST_LLM_BASE_URL, value: http://litellm:4000/v1 }
      - equal: { path: data.TRUST_LLM_MODEL, value: scam-check }
      - equal: { path: data.TRUST_CALL_TIMEOUT, value: 20s }
  # Production has no carrier until GHTK's client comes; the dev stack runs
  # the fake, whose dev endpoint moves its shipments.
  - it: runs production without a carrier
    documentIndex: 0
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.CARRIER, value: none }
      - equal: { path: data.CARRIER_POLL_EVERY, value: 2h }
      - equal: { path: data.GHTK_PARTNER_TOKEN, value: "" }
  - it: runs the dev stack on the fake carrier
    documentIndex: 0
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.CARRIER, value: fake }
  # dev's server-ai loads no SigLIP 2, so photo vectors are off there.
  - it: turns photo vectors off on dev and keeps text vectors
    documentIndex: 0
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - equal: { path: data.AI_EMBED_MODELS, value: "" }
      - equal: { path: data.EMBED_TEXT_MODEL, value: embed-text }
      - equal: { path: data.EMBED_TEXT_VERSION, value: bge-m3@5617a9f61b028005a4858fdac845db406aefb181 }
