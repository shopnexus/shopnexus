suite: sealed secrets
templates: [secrets.yaml, server.yaml, rustfs.yaml, litellm.yaml]
release: { namespace: shopnexus-dev }
tests:
  - it: includes the SealedSecrets of the stack
    template: secrets.yaml
    values: [../values-dev.yaml, values-test.yaml]
    asserts:
      - isKind:
          of: SealedSecret
      - equal:
          path: metadata.name
          value: probe
  - it: refuses to render without sealed secrets and names seal
    template: secrets.yaml
    values: [../values-dev.yaml, values-test.yaml]
    set: { secretsDir: tests/none }
    asserts:
      - failedTemplate:
          errorPattern: run go -C infra run ./cmd/seal dev
  # checksum/secrets is a hash of the stack's SealedSecrets on each pod
  # template, so a reseal starts new pods. acfd8016c2ed2431 is the hash of
  # tests/secrets/prod; tests/resealed/prod holds other values.
  - it: carries the hash of the sealed secrets
    values: [../values-prod.yaml, values-test.yaml]
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: server.yaml
        documentIndex: 1
      - equal:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: rustfs.yaml
        documentIndex: 0
      - equal:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: litellm.yaml
        documentIndex: 1
  - it: rolls the server, RustFS and LiteLLM on a reseal
    values: [../values-prod.yaml, values-test.yaml]
    set: { secretsDir: tests/resealed }
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: server.yaml
        documentIndex: 1
      - notEqual:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: rustfs.yaml
        documentIndex: 0
      - notEqual:
          path: spec.template.metadata.annotations["checksum/secrets"]
          value: acfd8016c2ed2431
        template: litellm.yaml
        documentIndex: 1
