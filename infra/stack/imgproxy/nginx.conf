# The cache in front of imgproxy, at imgproxy:8080: its Service in the
# cluster, a network alias in compose. Both read this file. One answer is
# kept per path and format; the Accept header is cut down to AVIF, WebP or
# anything, and imgproxy gets the same value, so the key and the answer agree.
#
# It is also the media host's door to Garage (garage:3900 S3, garage:3902
# web): media/ of the bucket shopnexus reads without credentials, from the
# web endpoint, which finds the bucket by the Host header; the rest of the
# bucket goes to the S3 API, which wants a presigned URL. Other buckets and
# Garage's admin API stay off. imgproxy reads its photos here too.
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:16m max_size=1536m inactive=30d use_temp_path=off;

map $http_accept $img_accept {
    ~image/avif image/avif;
    ~image/webp image/webp;
    default     */*;
}

server {
    listen 80;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # robots.txt of the media host, which the ingress sends here: crawlers
    # may fetch the photos.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # The media bucket (OBJECT_STORE_BUCKET in env/server.env; infra/check.sh
    # checks the two agree).
    location /shopnexus/media/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://garage:3902/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host shopnexus;
    }

    # Presigned uploads and reads: the signature covers the host the client
    # used, so it goes through unchanged. A video is at most 50 MiB.
    location /shopnexus/ {
        proxy_pass http://garage:3900;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        client_max_body_size 64m;
        proxy_request_buffering off;
    }

    # imgproxy's health page stays inside.
    location = /_img/health {
        return 404;
    }

    location /_img/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://imgproxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept $img_accept;

        proxy_cache img;
        proxy_cache_key "$uri|$img_accept";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # The key already holds the format; Vary still goes to the browser.
        proxy_ignore_headers Vary;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
