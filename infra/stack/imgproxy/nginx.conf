# The cache in front of imgproxy, at imgproxy:8080: its Service in the
# cluster, a network alias in compose. Both read this file. One answer is
# kept per path and format; the Accept header is cut down to AVIF, WebP or
# anything, and imgproxy gets the same value, so the key and the answer agree.
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img:16m max_size=1536m inactive=30d use_temp_path=off;

map $http_accept $img_accept {
    ~image/avif image/avif;
    ~image/webp image/webp;
    default     */*;
}

server {
    listen 80;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # imgproxy's health page stays inside.
    location = /_img/health {
        return 404;
    }

    location /_img/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://imgproxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept $img_accept;

        proxy_cache img;
        proxy_cache_key "$uri|$img_accept";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # The key already holds the format; Vary still goes to the browser.
        proxy_ignore_headers Vary;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
