# ai (repo shopnexus/ai, chart/) in the dev stack, as the Application ai-dev
# deploys it into shopnexus-dev: ai-models, which the stack's LiteLLM calls
# for stt and embed-image. valuesObject sets the stack's name, the models it
# loads and ai-models' memory.
# ai-models loads no SigLIP 2 on dev: the machine has no room for its 4.5 GB
# (2026-11-17), so photo vectors are off (stack server.embed.image). Speech
# and frames alone peaked at 2.42 GiB on 2026-11-10.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-dev
  namespace: argocd
  # After the stack (wave 1).
  # Server-side diff compares with what the API server would store, so the
  # defaults webhooks fill in (CNPG's role fields, a StatefulSet's claim
  # templates) do not show as drift.
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/shopnexus/ai.git
    targetRevision: main
    path: chart
    helm:
      valuesObject:
        stack: dev
        models:
          embedModels: ""
          memoryRequest: 2Gi
          memoryLimit: 3Gi
  destination: { server: https://kubernetes.default.svc, namespace: shopnexus-dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
# ai (repo shopnexus/ai, chart/) in the prod stack, as the Application
# ai-prod deploys it into shopnexus-prod: ai-models, which the stack's
# LiteLLM calls for stt and embed-image. valuesObject sets the stack's name,
# the models it loads and ai-models' memory.
# ai-models with SigLIP 2 held 4.0 GiB idle and 5.3 GiB on 16 photos
# (2026-11-10).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-prod
  namespace: argocd
  # After the stack (wave 1).
  # Server-side diff compares with what the API server would store, so the
  # defaults webhooks fill in (CNPG's role fields, a StatefulSet's claim
  # templates) do not show as drift.
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/shopnexus/ai.git
    # The ai commit the umbrella's release names; release.yml writes it and
    # images.models.tag.
    targetRevision: 699ef796c819aeae03f09223cea377a2ea5a1c33
    path: chart
    helm:
      valuesObject:
        stack: prod
        images:
          models: { repository: ghcr.io/shopnexus/ai, tag: 0.1.0 }
        models:
          embedModels: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384
          memoryRequest: 6Gi
          memoryLimit: 8Gi
  destination: { server: https://kubernetes.default.svc, namespace: shopnexus-prod }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
