apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-dev
  namespace: argocd
  # Server-side diff compares with what the API server would store, so the
  # defaults webhooks fill in (CNPG's role fields, a StatefulSet's claim
  # templates) do not show as drift.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/shopnexus/shopnexus.git
    targetRevision: main
    path: infra/stack
    helm: { valueFiles: [values-dev.yaml] }
  destination: { server: https://kubernetes.default.svc, namespace: shopnexus-dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-prod
  namespace: argocd
  # Server-side diff compares with what the API server would store, so the
  # defaults webhooks fill in (CNPG's role fields, a StatefulSet's claim
  # templates) do not show as drift.
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/shopnexus/shopnexus.git
    # The umbrella's release tag, which release.yml writes; the chart and
    # values-prod.yaml are the release's.
    targetRevision: v0.1.0
    path: infra/stack
    helm: { valueFiles: [values-prod.yaml] }
  destination: { server: https://kubernetes.default.svc, namespace: shopnexus-prod }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: -1, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
# dev follows :main by digest. Prod runs what a release of the umbrella
# names (.github/workflows/release.yml), so Image Updater leaves it alone.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: shopnexus
  namespace: argocd
  annotations:
    # Its CRD comes with the image-updater Application in wave 0, after
    # root's dry-run has looked at every resource.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationRefs:
    - namePattern: stack-dev
      images:
        - { alias: server, imageName: "ghcr.io/shopnexus/server:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.server.repository, tag: images.server.tag } } }
        - { alias: website, imageName: "ghcr.io/shopnexus/clients/website:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.website.repository, tag: images.website.tag } } }
        - { alias: docs, imageName: "ghcr.io/shopnexus/docs:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.docs.repository, tag: images.docs.tag } } }
        - { alias: console, imageName: "ghcr.io/shopnexus/clients/console:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.console.repository, tag: images.console.tag } } }
        - { alias: agent, imageName: "ghcr.io/shopnexus/agent:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.agent.repository, tag: images.agent.tag } } }
        - { alias: agent-runtime, imageName: "ghcr.io/shopnexus/agent-runtime:main", commonUpdateSettings: { updateStrategy: digest }, manifestTargets: { helm: { name: images.agentRuntime.repository, tag: images.agentRuntime.tag } } }
