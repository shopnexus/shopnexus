# Argo CD, installed by k3s's Helm controller from the k3d config's files.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.11.7
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    configs:
      # Argo CD sits behind the console's sign-in at argocd.<prod domain>
      # (infra/stack/templates/dashboards.yaml), which lets admins only.
      # Behind that gate it asks for no sign-in of its own, and Traefik
      # terminates TLS.
      params:
        server.insecure: true
        # The stacks read only infra/. The umbrella's submodules include
        # private repos (app-android), and the anonymous clone of those fails.
        reposerver.enable.git.submodule: false
      rbac:
        policy.default: role:admin
      cm:
        users.anonymous.enabled: "true"
        # Argo CD stopped judging Application health in 1.8. Without this, root's
        # sync waves would not wait for the platform Applications (wave 0) to be
        # Healthy before the stacks (wave 1) start.
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil and obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
          return hs
        # A RestateDeployment is Healthy once its current version is ready, so
        # the server's API Services (wave 3) move to it only then.
        resource.customizations.health.restate.dev_RestateDeployment: |
          hs = { status = "Progressing", message = "" }
          if obj.status == nil or obj.status.observedGeneration ~= obj.metadata.generation then
            return hs
          end
          local ready = obj.status.readyReplicas or 0
          if ready >= (obj.status.desiredReplicas or 1) then
            hs.status = "Healthy"
          end
          return hs
    # Anonymous users are admins, so outside its namespace only Traefik,
    # behind the console's gate, reaches Argo CD. The chart's own policies
    # let any pod reach argocd-server.
    global:
      networkPolicy:
        create: false
    extraObjects:
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: from-argocd-and-traefik
        spec:
          podSelector: {}
          policyTypes: [Ingress]
          ingress:
            - from:
                - podSelector: {}
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: kube-system }
                  podSelector:
                    matchLabels: { app.kubernetes.io/name: traefik }
