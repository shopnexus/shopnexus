name: API contract

# The website's generated API types must match the server's OpenAPI at the
# commits the umbrella pins, the pair a release ships together.
on:
  pull_request:
    paths: [server, website, .github/workflows/contract.yml]
  push:
    branches: [main]
    paths: [server, website, .github/workflows/contract.yml]

jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init --depth 1 server website
      - uses: oven-sh/setup-bun@v2
      - working-directory: website
        run: |
          bun install --frozen-lockfile
          SERVER_API=../server/api bun run api:check
