name: API contract

# The website's generated API types must match the server's OpenAPI at the
# commits the umbrella pins, the pair a release ships together.
on:
  pull_request:
    paths: [server, clients, .github/workflows/contract.yml]
  push:
    branches: [main]
    paths: [server, clients, .github/workflows/contract.yml]

jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: git submodule update --init --depth 1 server
      # clients is private: its read-only deploy key fetches the commit the umbrella pins.
      - id: clients
        run: echo "sha=$(git rev-parse HEAD:clients)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shopnexus/clients
          ref: ${{ steps.clients.outputs.sha }}
          path: clients
          ssh-key: ${{ secrets.CLIENTS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - working-directory: clients/website
        run: |
          bun install --frozen-lockfile
          SERVER_API=../../server/api bun run api:check

