name: Release

# A prod release of the whole system: the commits the umbrella's submodules
# point at on main. For each of server, website, docs, console, agent and ai
# it adds the tag X.Y.Z to the image CI built for that commit
# (ghcr.io/shopnexus/<repo>:sha-<commit>), without a rebuild. Then it writes
# the release into infra/ (values-prod.yaml, stack-prod's targetRevision
# vX.Y.Z, ai-prod's ai commit and image tag), commits "release X.Y.Z" on
# main, tags that commit vX.Y.Z and pushes both; Argo CD deploys prod from
# them. Rollback: revert the release commit on main.
#
# Each of the six GHCR packages must grant this repository write access
# (package settings, Manage Actions access), so that GITHUB_TOKEN can tag it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, X.Y.Z, higher than the last release"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install yq
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x "$HOME/bin/yq"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check the version
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not X.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION exists"; exit 1
          fi
          last=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [[ -n $last ]] && [[ $(printf '%s\nv%s\n' "$last" "$VERSION" | sort -V | tail -1) != "v$VERSION" ]]; then
            echo "::error::v$VERSION is not higher than $last"; exit 1
          fi

      # Every image must exist before any gets the tag, so a release is
      # tagged whole or not at all.
      - name: Find each submodule's image
        run: |
          : > images.txt
          for repo in server website docs console agent ai; do
            commit=$(git rev-parse "HEAD:$repo")
            image="ghcr.io/shopnexus/$repo:sha-$commit"
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "::error::$image does not exist: $repo's CI has not built $commit, or cleanup removed it (it keeps the 10 newest builds)"
              exit 1
            fi
            echo "$repo $commit" >> images.txt
          done
          cat images.txt

      - name: Tag the images X.Y.Z
        run: |
          while read -r repo commit; do
            docker buildx imagetools create --tag "ghcr.io/shopnexus/$repo:$VERSION" "ghcr.io/shopnexus/$repo:sha-$commit"
          done < images.txt

      # sed edits the release's lines alone, keeping the files' layout; yq
      # then reads them back.
      - name: Write the release into infra
        run: |
          ai=$(awk '$1 == "ai" { print $2 }' images.txt)
          sed -Ei "s/^(  (server|website|docs|console|agent): \{ repository: [^,]+, tag: )[^ ]+( \})$/\1$VERSION\3/" infra/stack/values-prod.yaml
          sed -Ei "s/^(    targetRevision: )v[0-9]+\.[0-9]+\.[0-9]+$/\1v$VERSION/" infra/argocd/stacks.yaml
          sed -Ei "s/^(    targetRevision: )[0-9a-f]{40}$/\1$ai/; s/^(          models: \{ repository: ghcr.io\/shopnexus\/ai, tag: )[^ ]+( \})$/\1$VERSION\2/" infra/argocd/ai.yaml
          rm images.txt
          fail=0
          check() { [[ $2 == "$3" ]] || { echo "::error::$1 is $2, want $3"; fail=1; }; }
          for repo in server website docs console agent; do
            check "values-prod $repo" "$(yq ".images.$repo.tag" infra/stack/values-prod.yaml)" "$VERSION"
          done
          check "stack-prod targetRevision" "$(yq 'select(.metadata.name == "stack-prod") | .spec.source.targetRevision' infra/argocd/stacks.yaml)" "v$VERSION"
          check "ai-prod targetRevision" "$(yq 'select(.metadata.name == "ai-prod") | .spec.source.targetRevision' infra/argocd/ai.yaml)" "$ai"
          check "ai-prod models tag" "$(yq 'select(.metadata.name == "ai-prod") | .spec.source.helm.valuesObject.images.models.tag' infra/argocd/ai.yaml)" "$VERSION"
          (( fail == 0 ))
          git diff --stat

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
