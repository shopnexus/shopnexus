# The whole system on one machine, in three stacks. Each profile is a stack of
# its own, with its own network, Postgres, Restate, RustFS and volumes, so the
# stacks never share data and can run at the same time. Production is the k3d
# cluster in ./infra; this file is for running things locally.
#
#   docker compose --profile dev up --build --watch    # everything, with live reload
#   docker compose --profile prod up -d --build        # the images the cluster runs
#   docker compose --profile test run --rm --build tests   # the server's Go tests
#
# dev and prod each sit behind one Caddy that routes by host, the way the
# cluster's ingress does, on the domain shopnexus.localhost: browsers resolve
# *.localhost to 127.0.0.1, and every host shares the site shopnexus.localhost,
# as the cluster's hosts share theirs, so the console's SameSite cookie reaches
# the API.
#
#              dev                                        prod
#   website    http://shopnexus.localhost:56481           http://shopnexus.localhost:56480
#   api        http://api.shopnexus.localhost:56481       http://api.shopnexus.localhost:56480
#   media      http://media.shopnexus.localhost:56481     http://media.shopnexus.localhost:56480
#   docs       http://docs.shopnexus.localhost:56481      http://docs.shopnexus.localhost:56480
#   console    http://console.shopnexus.localhost:56481   http://console.shopnexus.localhost:56480
#   grafana    http://grafana.shopnexus.localhost:56481   http://grafana.shopnexus.localhost:56480
#   restate    http://restate.shopnexus.localhost:56481   http://restate.shopnexus.localhost:56480
#   s3         http://s3.shopnexus.localhost:56481        http://s3.shopnexus.localhost:56480
#   ai-models  http://127.0.0.1:56491                     http://127.0.0.1:56490
#
# The console agent (agent-dev, agent-prod) has no host or port: only the
# server calls it, and it calls the server's MCP port 9090.
#
# Grafana gets the server's traces, metrics and logs. The dashboards need no
# sign-in here; in the cluster the console's sign-in guards them.
#
# dev runs the server with go run and the web apps' dev servers. --watch
# copies a saved file into its container: the web dev servers reload the
# page, and the server's container restarts and builds again. A change to
# go.mod, package.json or a lock file rebuilds the image; a change under
# server/migrations runs the migrations again.
#
# test runs the server's Go tests against Postgres, Restate and RustFS on
# tmpfs. run starts them and exits with the tests' status; they keep running
# for the next run, and `docker compose --profile test down` empties them.
# The tests container shares Restate's network namespace, so Restate reaches
# the endpoints the tests serve on 127.0.0.1.
#
# The server needs an OpenAI-compatible API for search, video reads and scam
# checks in dev and prod: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL,
# ASSIST_LLM_BASE_URL, ASSIST_LLM_API_KEY, ASSIST_LLM_MODEL and
# TRUST_LLM_BASE_URL, TRUST_LLM_API_KEY, TRUST_LLM_MODEL, read from
# server/.env (the Makefile passes --env-file server/.env). The console agent
# reads AGENT_LLM_BASE_URL, AGENT_LLM_API_KEY and AGENT_LLM_MODEL from the
# same file. For text embeddings the server reads EMBED_TEXT_BASE_URL,
# EMBED_TEXT_MODEL, EMBED_INDEX_API_KEY and EMBED_SEARCH_API_KEY from it too
# (OpenRouter's baai/bge-m3; an empty model turns text vectors off). It
# calls the stack's ai-models directly for photo vectors, speech and frames.
# In the cluster every model sits behind ai-gateway (submodule ai).
# The tests use a stub. The first start of a stack writes the server's keys
# into its keys volume. `docker compose --profile <stack> down -v` deletes
# the stack's data and keys.
#
# Image versions of Postgres, Restate and RustFS follow infra/stack/values.yaml;
# infra/check.sh fails when they differ.
name: shopnexus

# ── building blocks ──

x-postgres: &postgres
  image: paradedb/paradedb:0.26.4-pg18
  environment:
    POSTGRES_USER: shopnexus
    POSTGRES_PASSWORD: shopnexus
    POSTGRES_DB: shopnexus
  # Over TCP: during the first start the image runs a socket-only server
  # while it creates the database, and a socket check passes too early.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopnexus -d shopnexus"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

x-rustfs: &rustfs
  image: rustfs/rustfs:1.0.4
  environment: &rustfs-env
    RUSTFS_ACCESS_KEY: shopnexus
    RUSTFS_SECRET_KEY: shopnexus-secret
    RUSTFS_VOLUMES: /data
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_CONSOLE_ENABLE: "false"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# Signs every request to the server's endpoint with the key the stack's keys
# service wrote.
x-restate: &restate
  image: restatedev/restate:1.8.1
  environment: &restate-env
    RESTATE_BASE_DIR: /restate-data
    # A fixed name: the default is the container's hostname, which changes when
    # the container is created again, and Restate then refuses its own data.
    RESTATE_NODE_NAME: restate
    RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /keys/identity.pem
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9070/health"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# Grafana with Loki, Tempo, Prometheus and an OpenTelemetry collector in one
# container. Locally Grafana needs no sign-in.
x-lgtm: &lgtm
  image: grafana/otel-lgtm:0.37.0
  environment:
    GF_AUTH_ANONYMOUS_ENABLED: "true"
    GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    GF_AUTH_DISABLE_LOGIN_FORM: "true"
  restart: unless-stopped

# RustFS's web console on port 9001, for browsing the buckets.
x-rustfs-console-env: &rustfs-console-env
  <<: *rustfs-env
  RUSTFS_CONSOLE_ENABLE: "true"
  RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001

x-server-image: &server-image
  image: shopnexus-server:local
  build: ./server
  env_file: [./infra/stack/env/server.env]

# The models the AI hub hosts itself (submodule ai, ai-models). In the
# cluster ai-gateway's aliases stt and embed-image call it. Locally the
# server calls it directly, for photo vectors, speech and video frames.
x-ai-models: &ai-models
  image: shopnexus-ai:local
  build: ./ai
  environment:
    AI_ADDR: ":8000"
    AI_STT_MODELS: gipformer-1.5=/models/gipformer-1.5
    AI_VAD_MODEL: /models/silero_vad.onnx
    AI_NUM_THREADS: "4"
    AI_MAX_CONCURRENT: "2"
    AI_MAX_UPLOAD_MB: "100"
    AI_MAX_AUDIO_SECONDS: "300"
    AI_EMBED_MODELS: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384
    AI_EMBED_MAX_INPUTS: "16"
    AI_EMBED_MAX_CONCURRENT: "2"
    AI_EMBED_MAX_IMAGE_MB: "10"
    AI_FRAMES_MAX_CONCURRENT: "2"
    AI_FRAMES_MAX_SECONDS: "35"
    AI_FRAMES_MIN_SHARPNESS: "30"
  restart: unless-stopped

# Fills in the server's keys (JWT, CONSOLE_KEY, the Restate request identity
# key) in the stack's keys volume, as make run does in server/.env. Keys
# already there stay. The volume is the nonroot user's home, which the image
# owns, so the container writes it without root.
x-keys: &keys
  <<: *server-image
  env_file: []
  entrypoint: ["/envgen", "-env", "/home/nonroot/.env", "-restate", "/home/nonroot/identity.pem"]

# The server's configuration beyond infra/stack/env/server.env, which every
# container of the server image reads (env_file) and the cluster's chart
# reads too: what differs from the cluster. Each stack adds the addresses of
# its own services; the keys come from the .env the keys service wrote.
x-server-env: &server-env
  APP_ENV: dev
  LOG_LEVEL: info
  LOG_FORMAT: text
  RESTATE_REGISTER: "true"
  TRUSTED_PROXIES: ""
  # The ops dashboards are open locally, so the server serves none of them.
  DASHBOARD_HOSTS: ""
  OBJECT_STORE_ACCESS_KEY: shopnexus
  OBJECT_STORE_SECRET_KEY: shopnexus-secret
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  EMBED_TEXT_BASE_URL: ${EMBED_TEXT_BASE_URL:-}
  EMBED_TEXT_MODEL: ${EMBED_TEXT_MODEL:-}
  EMBED_IMAGE_MODEL: siglip2-so400m-patch16-384
  # OpenRouter's key for text; ai-models takes none and ignores it.
  EMBED_INDEX_API_KEY: ${EMBED_INDEX_API_KEY:-}
  EMBED_SEARCH_API_KEY: ${EMBED_SEARCH_API_KEY:-}
  # Video reads (module assist). Locally the server calls ai for speech with
  # its model name and no key, and the LLM in server/.env for the fill.
  STT_API_KEY: ""
  STT_MODEL: gipformer-1.5
  ASSIST_LLM_BASE_URL: ${ASSIST_LLM_BASE_URL:-}
  ASSIST_LLM_API_KEY: ${ASSIST_LLM_API_KEY:-}
  ASSIST_LLM_MODEL: ${ASSIST_LLM_MODEL:-}
  # Scam checks (module trust): the LLM in server/.env.
  TRUST_LLM_BASE_URL: ${TRUST_LLM_BASE_URL:-}
  TRUST_LLM_API_KEY: ${TRUST_LLM_API_KEY:-}
  TRUST_LLM_MODEL: ${TRUST_LLM_MODEL:-}
  # Shipments (modules deal and shipping): the fake GHTK and GHN, as the
  # dev cluster stack runs them. With them the server serves the dev
  # endpoint that moves their shipments. The token key comes from the keys
  # service.
  CARRIER: fake
  PNV_TEST_NUMBERS: "true"
  FCM_CREDENTIALS: ""
  EMAIL_SENDER: log
  RESEND_API_KEY: ""

x-server-env-dev: &server-env-dev
  <<: *server-env
  LOG_LEVEL: debug
  DATABASE_URL: postgres://shopnexus:shopnexus@postgres-dev:5432/shopnexus?sslmode=disable
  RESTATE_INGRESS_URL: http://restate-dev:8080
  RESTATE_ADMIN_URL: http://restate-dev:9070
  RESTATE_ENDPOINT_URL: http://server-dev:9080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm-dev:4318
  CONSOLE_ORIGIN: http://console.shopnexus.localhost:56481
  # The docs site's API playground, here and on a laptop's `bun run dev`.
  DOCS_ORIGINS: http://docs.shopnexus.localhost:56481,http://localhost:4321
  OBJECT_STORE_ENDPOINT: http://rustfs-dev:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: http://media.shopnexus.localhost:56481
  MEDIA_PUBLIC_URL: http://media.shopnexus.localhost:56481/shopnexus
  EMBED_IMAGE_BASE_URL: http://ai-models-dev:8000/v1
  AI_FRAMES_BASE_URL: http://ai-models-dev:8000/v1
  STT_BASE_URL: http://ai-models-dev:8000/v1
  AGENT_BASE_URL: http://agent-dev:3000

x-server-env-prod: &server-env-prod
  <<: *server-env
  DATABASE_URL: postgres://shopnexus:shopnexus@postgres-prod:5432/shopnexus?sslmode=disable
  RESTATE_INGRESS_URL: http://restate-prod:8080
  RESTATE_ADMIN_URL: http://restate-prod:9070
  RESTATE_ENDPOINT_URL: http://server-prod:9080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm-prod:4318
  CONSOLE_ORIGIN: http://console.shopnexus.localhost:56480
  DOCS_ORIGINS: http://docs.shopnexus.localhost:56480
  OBJECT_STORE_ENDPOINT: http://rustfs-prod:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: http://media.shopnexus.localhost:56480
  MEDIA_PUBLIC_URL: http://media.shopnexus.localhost:56480/shopnexus
  EMBED_IMAGE_BASE_URL: http://ai-models-prod:8000/v1
  AI_FRAMES_BASE_URL: http://ai-models-prod:8000/v1
  STT_BASE_URL: http://ai-models-prod:8000/v1
  AGENT_BASE_URL: http://agent-prod:3000

# The console agent (submodule agent). Its database is `agent` in the
# stack's Postgres: agent-db-* creates it, agent-migrate-* runs
# `prisma migrate deploy` on it, and the agent then starts. The agent takes
# AGENT_SERVICE_TOKEN and AGENT_MCP_TOKEN, and nothing else, from the .env
# the keys service wrote. There is no LiteLLM locally, so the agent calls the
# OpenAI-compatible API in server/.env: AGENT_LLM_BASE_URL, AGENT_LLM_API_KEY
# and AGENT_LLM_MODEL; in the cluster it calls LiteLLM's alias console-agent.
x-agent-image: &agent-image
  image: shopnexus-agent:local
  build: ./agent
  # The settings every stack shares with the cluster's chart.
  env_file: [./infra/stack/env/agent.env]

x-agent-env: &agent-env
  AGENT_MODEL_ID: ${AGENT_LLM_MODEL:-}
  LITELLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
  LITELLM_API_KEY: ${AGENT_LLM_API_KEY:-}
  POSTGRES_USER: shopnexus
  POSTGRES_PASSWORD: shopnexus

x-agent-env-dev: &agent-env-dev
  <<: *agent-env
  POSTGRES_HOST: postgres-dev
  DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-dev:5432/agent
  MCP_SERVER_URL: http://server-dev:9090/mcp

x-agent-env-prod: &agent-env-prod
  <<: *agent-env
  POSTGRES_HOST: postgres-prod
  DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-prod:5432/agent
  MCP_SERVER_URL: http://server-prod:9090/mcp

# Creates the database agent when it is missing; pgvector and pg_trgm come
# with the agent's first migration.
x-agent-db: &agent-db
  image: paradedb/paradedb:0.26.4-pg18
  entrypoint: ["sh", "-ec"]
  restart: "no"

# Exports the two tokens from the keys volume, then starts the agent; a
# .env without them stops the start.
x-agent-run: &agent-run
  entrypoint: ["sh", "-ec", "tokens=$$(grep -E '^AGENT_(SERVICE|MCP)_TOKEN=' /keys/.env); export $$tokens; exec node dist/main.js"]
  restart: unless-stopped

# A web app's dev image: its dependencies, then its source. DIR is the app's
# directory in the build context; $$ keeps Compose from reading ${DIR} as one
# of its own variables.
x-bun-dev-dockerfile: &bun-dev-dockerfile |
  FROM oven/bun:1.4.4
  ARG DIR=.
  WORKDIR /src
  COPY $${DIR}/package.json $${DIR}/bun.lock ./
  RUN bun install --frozen-lockfile
  COPY $${DIR}/ ./

x-dev: &dev
  profiles: [dev]
  networks: [dev]

x-prod: &prod
  profiles: [prod]
  networks: [prod]

x-test: &test
  profiles: [test]
  networks: [test]

services:
  # ── dev ──

  postgres-dev:
    <<: [*dev, *postgres]
    volumes: [postgres-dev:/var/lib/postgresql]

  rustfs-dev:
    <<: [*dev, *rustfs]
    environment: *rustfs-console-env
    volumes: [rustfs-dev:/data]

  lgtm-dev:
    <<: [*dev, *lgtm]
    volumes: [lgtm-dev:/data]

  keys-dev:
    <<: [*dev, *keys]
    volumes: [keys-dev:/home/nonroot]

  restate-dev:
    <<: [*dev, *restate]
    volumes: [restate-dev:/restate-data, keys-dev:/keys:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }

  migrate-dev:
    <<: [*dev, *server-image]
    entrypoint: ["/migrate"]
    working_dir: /home/nonroot
    environment: *server-env-dev
    volumes: [keys-dev:/home/nonroot:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }
      postgres-dev: { condition: service_healthy }
    develop:
      watch:
        - { action: rebuild, path: ./server/migrations }

  objectstore-init-dev:
    <<: [*dev, *server-image]
    entrypoint: ["/objectstore-init"]
    working_dir: /home/nonroot
    environment: *server-env-dev
    volumes: [keys-dev:/home/nonroot:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }
      rustfs-dev: { condition: service_healthy }

  # go run on the source. The image holds the modules; .dockerignore keeps the
  # host's .env out, and the .env here is the keys-dev volume's.
  server-dev:
    <<: *dev
    image: shopnexus-server-dev:local
    build:
      context: ./server
      dockerfile_inline: |
        FROM golang:1.27.3
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN ln -s /keys/.env .env
    command: ["go", "run", "./cmd/server"]
    env_file: [./infra/stack/env/server.env]
    environment: *server-env-dev
    volumes: [keys-dev:/keys:ro, go-build-dev:/root/.cache/go-build]
    depends_on:
      migrate-dev: { condition: service_completed_successfully }
      objectstore-init-dev: { condition: service_completed_successfully }
      restate-dev: { condition: service_healthy }
    restart: unless-stopped
    develop:
      watch:
        - { action: sync+restart, path: ./server, target: /src, ignore: [.env, .restate/, tmp/, bin/, .git/] }
        - { action: rebuild, path: ./server/go.mod }
        - { action: rebuild, path: ./server/go.sum }

  docs-dev:
    <<: *dev
    image: shopnexus-docs-dev:local
    build:
      context: ./docs
      args: { DIR: web }
      dockerfile_inline: *bun-dev-dockerfile
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "4321"]
    environment:
      # true adds the internal pages (the Developers tab).
      DOCS_INTERNAL: ${DOCS_INTERNAL:-true}
    # The Requirements pages and the API playground read ../registry.
    volumes:
      - ./docs/registry:/registry:ro
    restart: unless-stopped
    develop:
      watch:
        - { action: sync, path: ./docs/web, target: /src, ignore: [node_modules/, dist/, .astro/] }
        - { action: rebuild, path: ./docs/web/package.json }
        - { action: rebuild, path: ./docs/web/bun.lock }

  website-dev:
    <<: *dev
    image: shopnexus-website-dev:local
    build:
      context: ./website
      dockerfile_inline: *bun-dev-dockerfile
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "4321"]
    environment:
      API_URL: http://server-dev:8080/v1
    restart: unless-stopped
    develop:
      watch:
        - { action: sync, path: ./website, target: /src, ignore: [node_modules/, dist/, .astro/] }
        - { action: rebuild, path: ./website/package.json }
        - { action: rebuild, path: ./website/bun.lock }

  # The console finds the API at api.<its own host>, so console.localhost
  # calls api.localhost.
  console-dev:
    <<: *dev
    image: shopnexus-console-dev:local
    build:
      context: ./console
      dockerfile_inline: *bun-dev-dockerfile
    command: ["bun", "run", "dev", "--host", "0.0.0.0"]
    restart: unless-stopped
    develop:
      watch:
        - { action: sync, path: ./console, target: /src, ignore: [node_modules/, dist/] }
        - { action: rebuild, path: ./console/package.json }
        - { action: rebuild, path: ./console/bun.lock }

  ai-models-dev:
    <<: [*dev, *ai-models]
    ports: ["127.0.0.1:56491:8000"]

  agent-db-dev:
    <<: [*dev, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-dev -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE agent' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent') \gexec
        SQL
    depends_on:
      postgres-dev: { condition: service_healthy }

  agent-migrate-dev:
    <<: [*dev, *agent-image]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *agent-env-dev
    depends_on:
      agent-db-dev: { condition: service_completed_successfully }
    develop:
      watch:
        - { action: rebuild, path: ./agent/prisma }

  # The keys service's user, which owns the .env (mode 600).
  agent-dev:
    <<: [*dev, *agent-image, *agent-run]
    user: "65532:65532"
    environment: *agent-env-dev
    volumes: [keys-dev:/keys:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }
      agent-migrate-dev: { condition: service_completed_successfully }
    develop:
      watch:
        - { action: rebuild, path: ./agent/src }
        - { action: rebuild, path: ./agent/package.json }
        - { action: rebuild, path: ./agent/package-lock.json }

  proxy-dev:
    <<: *dev
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:56481:80"]
    configs:
      - { source: caddyfile-dev, target: /etc/caddy/Caddyfile }
    restart: unless-stopped

  # ── prod ──

  postgres-prod:
    <<: [*prod, *postgres]
    volumes: [postgres-prod:/var/lib/postgresql]

  rustfs-prod:
    <<: [*prod, *rustfs]
    environment: *rustfs-console-env
    volumes: [rustfs-prod:/data]

  lgtm-prod:
    <<: [*prod, *lgtm]
    volumes: [lgtm-prod:/data]

  keys-prod:
    <<: [*prod, *keys]
    volumes: [keys-prod:/home/nonroot]

  restate-prod:
    <<: [*prod, *restate]
    volumes: [restate-prod:/restate-data, keys-prod:/keys:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }

  migrate-prod:
    <<: [*prod, *server-image]
    entrypoint: ["/migrate"]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }
      postgres-prod: { condition: service_healthy }

  objectstore-init-prod:
    <<: [*prod, *server-image]
    entrypoint: ["/objectstore-init"]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }
      rustfs-prod: { condition: service_healthy }

  server-prod:
    <<: [*prod, *server-image]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro]
    depends_on:
      migrate-prod: { condition: service_completed_successfully }
      objectstore-init-prod: { condition: service_completed_successfully }
      restate-prod: { condition: service_healthy }
    restart: unless-stopped

  website-prod:
    <<: *prod
    image: shopnexus-website:local
    build: ./website
    environment:
      API_URL: http://server-prod:8080/v1
    depends_on: [server-prod]
    restart: unless-stopped

  # The console finds the API at api.<its own host>, so console.localhost
  # calls api.localhost.
  console-prod:
    <<: *prod
    image: shopnexus-console:local
    build: ./console
    restart: unless-stopped

  docs-prod:
    <<: *prod
    image: shopnexus-docs:local
    build: ./docs
    restart: unless-stopped

  ai-models-prod:
    <<: [*prod, *ai-models]
    ports: ["127.0.0.1:56490:8000"]

  agent-db-prod:
    <<: [*prod, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-prod -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE agent' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent') \gexec
        SQL
    depends_on:
      postgres-prod: { condition: service_healthy }

  agent-migrate-prod:
    <<: [*prod, *agent-image]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *agent-env-prod
    depends_on:
      agent-db-prod: { condition: service_completed_successfully }

  # The keys service's user, which owns the .env (mode 600).
  agent-prod:
    <<: [*prod, *agent-image, *agent-run]
    user: "65532:65532"
    environment: *agent-env-prod
    volumes: [keys-prod:/keys:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }
      agent-migrate-prod: { condition: service_completed_successfully }

  proxy-prod:
    <<: *prod
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:56480:80"]
    configs:
      - { source: caddyfile-prod, target: /etc/caddy/Caddyfile }
    depends_on: [server-prod, website-prod, console-prod, docs-prod, rustfs-prod]
    restart: unless-stopped

  # ── test ──

  # go test runs a package per CPU, each test on a cloned database of about
  # 13 MB, and holds connections longer while ParadeDB writes its index.
  # Port 56433 and database server2_test are what the tests' guard
  # (internal/platform/postgres/pgtest) accepts, so they never drop other data.
  postgres-test:
    <<: [*test, *postgres]
    environment:
      POSTGRES_USER: shopnexus
      POSTGRES_PASSWORD: shopnexus
      POSTGRES_DB: server2_test
    command: postgres -p 56433 -c max_connections=400
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 56433 -U shopnexus -d server2_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql:size=4g]
    mem_limit: 4608m

  rustfs-test:
    <<: [*test, *rustfs]
    tmpfs: ["/data:size=512m,uid=10001,gid=10001"]
    mem_limit: 768m

  keys-test:
    <<: [*test, *keys]
    volumes: [keys-test:/home/nonroot]

  restate-test:
    <<: [*test, *restate]
    environment:
      <<: *restate-env
      # RocksDB sizes itself for a server; the tmpfs counts toward mem_limit.
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: 256MB
    tmpfs: [/restate-data:size=1g]
    mem_limit: 2048m
    volumes: [keys-test:/keys:ro]
    depends_on:
      keys-test: { condition: service_completed_successfully }

  # The source is mounted read-only. Restate's network namespace makes
  # 127.0.0.1 here Restate's own, and the variables below override the host
  # ports in server/.env.test.
  tests:
    profiles: [test]
    image: shopnexus-server-test:local
    build:
      context: ./server
      dockerfile_inline: |
        FROM golang:1.27.3
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
    network_mode: service:restate-test
    command: ["go", "test", "-race", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://shopnexus:shopnexus@postgres-test:56433/server2_test?sslmode=disable
      TEST_RESTATE_INGRESS_URL: http://127.0.0.1:8080
      TEST_RESTATE_ADMIN_URL: http://127.0.0.1:9070
      TEST_RESTATE_IDENTITY_FILE: /keys/identity.pem
      TEST_OBJECT_STORE_ENDPOINT: http://rustfs-test:9000
      TEST_OBJECT_STORE_PUBLIC_ENDPOINT: http://rustfs-test:9000
      TEST_OBJECT_STORE_ACCESS_KEY: shopnexus
      TEST_OBJECT_STORE_SECRET_KEY: shopnexus-secret
      TEST_MEDIA_PUBLIC_URL: http://rustfs-test:9000/server2-test
    volumes: [./server:/src:ro, keys-test:/keys:ro, go-build-test:/root/.cache/go-build]
    depends_on:
      postgres-test: { condition: service_healthy }
      rustfs-test: { condition: service_healthy }
      restate-test: { condition: service_healthy }

networks:
  dev:
  prod:
  test:

configs:
  caddyfile-dev:
    content: |
      {
        auto_https off
        admin off
      }
      http://shopnexus.localhost {
        reverse_proxy website-dev:4321
      }
      http://api.shopnexus.localhost {
        reverse_proxy server-dev:8080
      }
      http://media.shopnexus.localhost {
        reverse_proxy rustfs-dev:9000
      }
      http://docs.shopnexus.localhost {
        reverse_proxy docs-dev:4321
      }
      http://console.shopnexus.localhost {
        reverse_proxy console-dev:5173
      }
      http://grafana.shopnexus.localhost {
        reverse_proxy lgtm-dev:3000
      }
      http://restate.shopnexus.localhost {
        reverse_proxy restate-dev:9070
      }
      http://s3.shopnexus.localhost {
        redir / /rustfs/console/
        reverse_proxy rustfs-dev:9001
      }
  caddyfile-prod:
    content: |
      {
        auto_https off
        admin off
      }
      http://shopnexus.localhost {
        reverse_proxy website-prod:3000
      }
      http://api.shopnexus.localhost {
        reverse_proxy server-prod:8080
      }
      http://media.shopnexus.localhost {
        reverse_proxy rustfs-prod:9000
      }
      http://docs.shopnexus.localhost {
        reverse_proxy docs-prod:80
      }
      http://console.shopnexus.localhost {
        reverse_proxy console-prod:80
      }
      http://grafana.shopnexus.localhost {
        reverse_proxy lgtm-prod:3000
      }
      http://restate.shopnexus.localhost {
        reverse_proxy restate-prod:9070
      }
      http://s3.shopnexus.localhost {
        redir / /rustfs/console/
        reverse_proxy rustfs-prod:9001
      }

volumes:
  postgres-dev:
  rustfs-dev:
  restate-dev:
  keys-dev:
  go-build-dev:
  lgtm-dev:
  postgres-prod:
  rustfs-prod:
  restate-prod:
  keys-prod:
  lgtm-prod:
  keys-test:
  go-build-test:
