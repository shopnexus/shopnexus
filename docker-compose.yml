# The whole system on one machine, in three stacks. Each profile is a stack of
# its own, with its own network, Postgres, Restate, RustFS and volumes, so the
# stacks never share data and can run at the same time. Production is the k3d
# cluster in ./infra; this file is for running things locally.
#
#   docker compose --profile dev up -d --build         # everything, with live reload
#   docker compose --profile prod up -d --build        # the images the cluster runs
#   docker compose --profile test run --rm --build tests   # the server's Go tests
#
# dev and prod each sit behind one Caddy that routes by host, the way the
# cluster's ingress does, on the domain shopnexus.localhost: browsers resolve
# *.localhost to 127.0.0.1, and every host shares the site shopnexus.localhost,
# as the cluster's hosts share theirs, so the console's SameSite cookie reaches
# the API.
#
#              dev                                        prod
#   website    http://shopnexus.localhost:56481           http://shopnexus.localhost:56480
#   api        http://api.shopnexus.localhost:56481       http://api.shopnexus.localhost:56480
#   media      http://media.shopnexus.localhost:56481     http://media.shopnexus.localhost:56480
#   docs       http://docs.shopnexus.localhost:56481      http://docs.shopnexus.localhost:56480
#   console    http://console.shopnexus.localhost:56481   http://console.shopnexus.localhost:56480
#   grafana    http://grafana.shopnexus.localhost:56481   http://grafana.shopnexus.localhost:56480
#   restate    http://restate.shopnexus.localhost:56481   http://restate.shopnexus.localhost:56480
#   s3         http://s3.shopnexus.localhost:56481        http://s3.shopnexus.localhost:56480
#   litellm    (no host: only the server and the agent call it)
#
# The console agent (agent-dev, agent-prod) has no host or port: only the
# server calls it, and it calls the server's MCP port 9090.
#
# Grafana gets the server's traces, metrics and logs. Here Caddy signs every
# visitor in as admin@shopnexus.localhost, an Admin; in the cluster the
# console's sign-in names the member.
#
# dev mounts the source into its containers and reloads on save (air for
# the server, the dev servers for the web apps, node --watch for the agent).
# After a lock file changes, restart the service to install the packages.
#
# test runs the server's Go tests against Postgres, Restate and RustFS on
# tmpfs. run starts them and exits with the tests' status; they keep running
# for the next run, and `docker compose --profile test down` empties them.
# The tests container shares Restate's network namespace, so Restate reaches
# the endpoints the tests serve on 127.0.0.1.
#
# Every model call of the server and the console agent goes to the stack's
# LiteLLM, as in the cluster: the same config
# (infra/stack/litellm/config.yaml), the same starting aliases
# (infra/stack/litellm/models/) and the same keys, one
# per purpose (infra/stack/litellm/keys.txt). litellm-keys-* adds those keys
# to the stack's keys volume and litellm-sync-* registers them with a
# budget. LiteLLM reads the upstream keys, LLM_UPSTREAM_API_KEY and
# OPENROUTER_API_KEY, from infra/stack/secrets/compose.env, and the rest of
# its settings from infra/stack/env/litellm.env. Inside a stack litellm
# answers by that name, as its Service does in the cluster.
#
# LiteLLM keeps its aliases in its database; litellm-sync-* adds the ones of
# infra/stack/litellm/models/ it lacks before it registers the keys. The
# server reaches LiteLLM's admin API at LITELLM_URL (server.env) with
# LITELLM_MASTER_KEY, which the keys volume's .env holds for it as for
# LiteLLM.
#
# The console agent's run bus is the stack's Redis (redis-dev, redis-prod),
# which answers by the name redis inside its stack, as its Service does in
# the cluster.
#
# Speech, photo vectors and video frames are the server's module ai, which
# runs in the server container here (SERVER_ROLE unset, so all) with the
# model files from the stack's models volume; fetch-models-* fills it with
# the server image's /fetch-models.sh and keeps files already there.
# The tests use a stub. The first start of a stack writes the server's keys
# into its keys volume. `docker compose --profile <stack> down -v` deletes
# the stack's data and keys.
#
# Image versions of Postgres, Restate, RustFS, LiteLLM and Redis follow
# infra/stack/values.yaml; infra/check.sh fails when they differ.
name: shopnexus

# ── building blocks ──

# Healthchecks; the bun and node images have no curl, so they use fetch.
x-health: &health
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 2m
x-health-bun: &health-bun
  <<: *health
  test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:' + (process.env.HEALTH_PORT ?? 4321))"]
x-health-agent: &health-agent
  <<: *health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').catch(() => process.exit(1))"]
x-health-server: &health-server
  <<: *health
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
x-health-wget: &health-wget
  <<: *health
  test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]

x-postgres: &postgres
  image: paradedb/paradedb:0.26.4-pg18
  environment:
    POSTGRES_USER: shopnexus
    POSTGRES_PASSWORD: shopnexus
    POSTGRES_DB: shopnexus
  # Over TCP: during the first start the image runs a socket-only server
  # while it creates the database, and a socket check passes too early.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shopnexus -d shopnexus"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# pgweb on the stack's database, the dashboard db, as in the cluster.
x-pgweb: &pgweb
  image: sosedoff/pgweb:0.17.0
  command: [--bind=0.0.0.0, --listen=8081, --lock-session, --skip-open]
  healthcheck: { <<: *health, test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/"] }
  restart: unless-stopped

x-rustfs: &rustfs
  image: rustfs/rustfs:1.0.4
  environment: &rustfs-env
    RUSTFS_ACCESS_KEY: shopnexus
    RUSTFS_SECRET_KEY: shopnexus-secret
    RUSTFS_VOLUMES: /data
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_CONSOLE_ENABLE: "false"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# Signs every request to the server's endpoint with the key the stack's keys
# service wrote.
x-restate: &restate
  image: restatedev/restate:1.8.1
  environment: &restate-env
    RESTATE_BASE_DIR: /restate-data
    # A fixed name: the default is the container's hostname, which changes when
    # the container is created again, and Restate then refuses its own data.
    RESTATE_NODE_NAME: restate
    RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /keys/identity.pem
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9070/health"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# Redis for the console agent's runs, with the stack chart's image and
# arguments (infra/stack/templates/redis.yaml).
x-redis: &redis
  image: redis:7.4.12-alpine
  command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, volatile-lru]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 3s
    retries: 30
  restart: unless-stopped

# Grafana with Loki, Tempo, Prometheus and an OpenTelemetry collector in one
# container. It signs in the member that Caddy names in X-Console-Email.
x-lgtm: &lgtm
  image: grafana/otel-lgtm:0.37.0
  env_file: [./infra/stack/env/lgtm.env]
  restart: unless-stopped

# RustFS's web console on port 9001, for browsing the buckets.
x-rustfs-console-env: &rustfs-console-env
  <<: *rustfs-env
  RUSTFS_CONSOLE_ENABLE: "true"
  RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001

x-server-image: &server-image
  image: shopnexus-server:local
  build: ./server
  env_file: [./infra/stack/env/server.env]

# LiteLLM with the stack chart's config and image, its database litellm in
# the stack's Postgres. It takes LITELLM_MASTER_KEY from the keys volume.
x-litellm: &litellm
  image: ghcr.io/berriai/litellm-database:v1.108.0
  env_file:
    - ./infra/stack/env/litellm.env
    - { path: ./infra/stack/secrets/compose.env, required: false }
  entrypoint: ["sh", "-ec", "export $$(grep -E '^LITELLM_MASTER_KEY=' /keys/.env); exec litellm --config /etc/litellm/config.yaml --port 4000"]
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')"]
    interval: 5s
    timeout: 5s
    retries: 60
  restart: unless-stopped

# infra/stack/litellm/keys.sh: litellm-keys-* adds LiteLLM's keys missing
# from the keys volume's .env as the keys service's user, and litellm-sync-*
# adds the aliases of models/ LiteLLM lacks and registers the keys. Each key gets 20 of budget a day (20 USD for the agent,
# 20M tokens or requests for the others) and 600 requests a minute.
x-litellm-keys: &litellm-keys
  image: curlimages/curl:8.23.0
  user: "65532:65532"
  restart: "no"

x-litellm-sync: &litellm-sync
  <<: *litellm-keys
  entrypoint: ["sh", "-ec", "export $$(grep -E '^[A-Z_]*KEY=' /keys/.env); export MASTER_KEY=$$LITELLM_MASTER_KEY; sh /etc/keys/keys.sh models /etc/keys/models; exec sh /etc/keys/keys.sh sync /etc/keys/keys.txt"]
  environment:
    LITELLM_URL: http://litellm:4000
    LIMITS_DEFAULT: '"max_budget":20,"rpm_limit":600'

# Fills in the server's keys (JWT, CONSOLE_KEY, the Restate request identity
# key) in the stack's keys volume, as make run does in server/.env. Keys
# already there stay. The volume is the nonroot user's home, which the image
# owns, so the container writes it without root.
x-keys: &keys
  <<: *server-image
  env_file: []
  entrypoint: ["/envgen", "-env", "/home/nonroot/.env", "-restate", "/home/nonroot/identity.pem"]

# The server's configuration beyond infra/stack/env/server.env, which every
# container of the server image reads (env_file) and the cluster's chart
# reads too: what differs from the cluster. Each stack adds the addresses of
# its own services; the keys come from the .env the keys service wrote.
x-server-env: &server-env
  APP_ENV: dev
  LOG_LEVEL: info
  LOG_FORMAT: text
  RESTATE_REGISTER: "true"
  TRUSTED_PROXIES: ""
  # The ops dashboards are open locally, so the server serves none of them.
  DASHBOARD_HOSTS: ""
  OBJECT_STORE_ACCESS_KEY: shopnexus
  OBJECT_STORE_SECRET_KEY: shopnexus-secret
  # Both kinds of vector on, as the cluster's server.embed turns them on:
  # text through LiteLLM, photos through module ai's SigLIP 2. The other AI
  # settings are in server.env and the keys in the keys volume's .env.
  EMBED_TEXT_BASE_URL: http://litellm:4000/v1
  EMBED_TEXT_MODEL: embed-text
  AI_EMBED_MODELS: siglip2-so400m-patch16-384=/models/siglip2-so400m-patch16-384
  # Shipments (modules deal and shipping): the fake GHTK and GHN, as the
  # dev cluster stack runs them. With them the server serves the dev
  # endpoint that moves their shipments. The token key comes from the keys
  # service.
  CARRIER: fake
  PNV_TEST_NUMBERS: "true"
  FCM_CREDENTIALS: ""
  EMAIL_SENDER: log
  RESEND_API_KEY: ""

x-server-env-dev: &server-env-dev
  <<: *server-env
  LOG_LEVEL: debug
  DATABASE_URL: postgres://shopnexus:shopnexus@postgres-dev:5432/shopnexus?sslmode=disable
  RESTATE_INGRESS_URL: http://restate-dev:8080
  RESTATE_ADMIN_URL: http://restate-dev:9070
  RESTATE_ENDPOINT_URL: http://server-dev:9080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm-dev:4318
  CONSOLE_ORIGIN: http://console.shopnexus.localhost:56481
  # The docs site's API playground, here and on a laptop's `bun run dev`.
  DOCS_ORIGINS: http://docs.shopnexus.localhost:56481,http://localhost:4321
  OBJECT_STORE_ENDPOINT: http://rustfs-dev:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: http://media.shopnexus.localhost:56481
  MEDIA_PUBLIC_URL: http://media.shopnexus.localhost:56481/shopnexus
  AGENT_BASE_URL: http://agent-dev:3000

x-server-env-prod: &server-env-prod
  <<: *server-env
  DATABASE_URL: postgres://shopnexus:shopnexus@postgres-prod:5432/shopnexus?sslmode=disable
  RESTATE_INGRESS_URL: http://restate-prod:8080
  RESTATE_ADMIN_URL: http://restate-prod:9070
  RESTATE_ENDPOINT_URL: http://server-prod:9080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm-prod:4318
  CONSOLE_ORIGIN: http://console.shopnexus.localhost:56480
  DOCS_ORIGINS: http://docs.shopnexus.localhost:56480
  OBJECT_STORE_ENDPOINT: http://rustfs-prod:9000
  OBJECT_STORE_PUBLIC_ENDPOINT: http://media.shopnexus.localhost:56480
  MEDIA_PUBLIC_URL: http://media.shopnexus.localhost:56480/shopnexus
  AGENT_BASE_URL: http://agent-prod:3000

# The console agent (submodule agent). Its database is `agent` in the
# stack's Postgres: agent-db-* creates it, agent-migrate-* runs
# `prisma migrate deploy` on it, and the agent then starts. The agent takes
# AGENT_SERVICE_TOKEN, AGENT_MCP_TOKEN and its LiteLLM key
# AGENT_LLM_API_KEY, and nothing else, from the .env in the keys volume.
x-agent-image: &agent-image
  image: shopnexus-agent:local
  build: ./agent
  # The settings every stack shares with the cluster's chart.
  env_file: [./infra/stack/env/agent.env]

x-agent-env: &agent-env
  POSTGRES_USER: shopnexus
  POSTGRES_PASSWORD: shopnexus

x-agent-env-dev: &agent-env-dev
  <<: *agent-env
  POSTGRES_HOST: postgres-dev
  DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-dev:5432/agent
  MCP_SERVER_URL: http://server-dev:9090/mcp

x-agent-env-prod: &agent-env-prod
  <<: *agent-env
  POSTGRES_HOST: postgres-prod
  DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-prod:5432/agent
  MCP_SERVER_URL: http://server-prod:9090/mcp

# Creates the database agent when it is missing; pgvector and pg_trgm come
# with the agent's first migration.
x-agent-db: &agent-db
  image: paradedb/paradedb:0.26.4-pg18
  entrypoint: ["sh", "-ec"]
  restart: "no"

# Exports the two tokens and the LiteLLM key (as LITELLM_API_KEY) from the
# keys volume, then starts the agent; a .env without them stops the start.
x-agent-run: &agent-run
  entrypoint: ["sh", "-ec", "tokens=$$(grep -E '^AGENT_(SERVICE|MCP)_TOKEN=' /keys/.env); key=$$(sed -n 's/^AGENT_LLM_API_KEY=/LITELLM_API_KEY=/p' /keys/.env); export $$tokens $$key; exec node dist/main.js"]
  restart: unless-stopped

# A web app's dev server on its mounted source. It installs the packages
# when bun.lock changed since the last install.
x-bun-dev: &bun-dev
  image: oven/bun:1.4.4
  working_dir: /src
  entrypoint:
    - sh
    - -ec
    - |
      if ! cmp -s bun.lock node_modules/.bun.lock; then
        bun install --frozen-lockfile
        cp bun.lock node_modules/.bun.lock
      fi
      exec bun run dev "$$@"
    - bun-dev
  healthcheck: *health-bun
  restart: unless-stopped

x-dev: &dev
  profiles: [dev]
  networks: [dev]

x-prod: &prod
  profiles: [prod]
  networks: [prod]

x-test: &test
  profiles: [test]
  networks: [test]

services:
  # ── dev ──

  postgres-dev:
    <<: [*dev, *postgres]
    volumes: [postgres-dev:/var/lib/postgresql]

  rustfs-dev:
    <<: [*dev, *rustfs]
    environment: *rustfs-console-env
    volumes: [rustfs-dev:/data]

  lgtm-dev:
    <<: [*dev, *lgtm]
    volumes: [lgtm-dev:/data]

  pgweb-dev:
    <<: [*dev, *pgweb]
    environment:
      PGWEB_DATABASE_URL: postgres://shopnexus:shopnexus@postgres-dev:5432/shopnexus?sslmode=disable
    depends_on:
      postgres-dev: { condition: service_healthy }

  keys-dev:
    <<: [*dev, *keys]
    volumes: [keys-dev:/home/nonroot]

  restate-dev:
    <<: [*dev, *restate]
    volumes: [restate-dev:/restate-data, keys-dev:/keys:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }

  migrate-dev:
    <<: [*dev, *server-image]
    entrypoint: ["/migrate"]
    working_dir: /home/nonroot
    environment: *server-env-dev
    volumes: [keys-dev:/home/nonroot:ro]
    depends_on:
      litellm-keys-dev: { condition: service_completed_successfully }
      postgres-dev: { condition: service_healthy }

  objectstore-init-dev:
    <<: [*dev, *server-image]
    entrypoint: ["/objectstore-init"]
    working_dir: /home/nonroot
    environment: *server-env-dev
    volumes: [keys-dev:/home/nonroot:ro]
    depends_on:
      litellm-keys-dev: { condition: service_completed_successfully }
      rustfs-dev: { condition: service_healthy }

  # air rebuilds the server on a .go or .sql change and runs the migrations
  # before each start. The .env is the keys volume's, over the checkout's.
  server-dev:
    <<: *dev
    image: shopnexus-server-dev:local
    build:
      context: ./server
      dockerfile_inline: |
        FROM golang:1.27.3-trixie
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
        RUN go install github.com/air-verse/air@v1.67.4
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
    command: ["air", "-c", "/etc/air.toml"]
    env_file: [./infra/stack/env/server.env]
    environment: *server-env-dev
    volumes:
      - ./server:/src
      - { type: volume, source: keys-dev, target: /src/.env, read_only: true, volume: { subpath: .env } }
      - keys-dev:/keys:ro
      - models-dev:/models:ro
      - go-build-dev:/root/.cache/go-build
      - go-mod-dev:/go/pkg/mod
    configs:
      - { source: air-dev, target: /etc/air.toml }
    depends_on:
      migrate-dev: { condition: service_completed_successfully }
      objectstore-init-dev: { condition: service_completed_successfully }
      restate-dev: { condition: service_healthy }
      litellm-sync-dev: { condition: service_completed_successfully }
      fetch-models-dev: { condition: service_completed_successfully }
    healthcheck: *health-server
    restart: unless-stopped

  docs-dev:
    <<: [*dev, *bun-dev]
    command: ["--host", "0.0.0.0", "--port", "4321"]
    environment:
      # true adds the internal pages (the Developers tab).
      DOCS_INTERNAL: ${DOCS_INTERNAL:-true}
    # The Requirements pages and the API playground read ../registry.
    volumes:
      - ./docs/web:/src
      - ./docs/registry:/registry:ro
      - docs-node-modules-dev:/src/node_modules
      - docs-astro-dev:/src/.astro

  website-dev:
    <<: [*dev, *bun-dev]
    # Astro's lock file outlives the container; one server runs here anyway.
    command: ["--host", "0.0.0.0", "--port", "4321", "--ignore-lock"]
    environment:
      API_URL: http://server-dev:8080/v1
    volumes:
      - ./website:/src
      - website-node-modules-dev:/src/node_modules
      - website-astro-dev:/src/.astro

  # The console finds the API at api.<its own host>, so console.localhost
  # calls api.localhost.
  console-dev:
    <<: [*dev, *bun-dev]
    command: ["--host", "0.0.0.0"]
    environment: { HEALTH_PORT: 5173 }
    volumes:
      - ./console:/src
      - console-node-modules-dev:/src/node_modules

  fetch-models-dev:
    <<: [*dev, *server-image]
    user: "65532:65532"
    entrypoint: ["/fetch-models.sh", "/models"]
    volumes: [models-dev:/models]
    restart: "no"

  litellm-keys-dev:
    <<: [*dev, *litellm-keys]
    command: ["sh", "/etc/keys/keys.sh", "gen", "/etc/keys/keys.txt", "/keys/.env"]
    volumes: [keys-dev:/keys, ./infra/stack/litellm:/etc/keys:ro]
    depends_on:
      keys-dev: { condition: service_completed_successfully }

  litellm-db-dev:
    <<: [*dev, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-dev -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE litellm' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'litellm') \gexec
        SQL
    depends_on:
      postgres-dev: { condition: service_healthy }

  litellm-dev:
    <<: [*dev, *litellm]
    networks: { dev: { aliases: [litellm] } }
    environment:
      DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-dev:5432/litellm
    volumes: [keys-dev:/keys:ro, ./infra/stack/litellm/config.yaml:/etc/litellm/config.yaml:ro]
    depends_on:
      litellm-keys-dev: { condition: service_completed_successfully }
      litellm-db-dev: { condition: service_completed_successfully }

  litellm-sync-dev:
    <<: [*dev, *litellm-sync]
    volumes: [keys-dev:/keys:ro, ./infra/stack/litellm:/etc/keys:ro]
    depends_on:
      litellm-dev: { condition: service_healthy }

  redis-dev:
    <<: [*dev, *redis]
    networks: { dev: { aliases: [redis] } }
    volumes: [redis-dev:/data]

  agent-db-dev:
    <<: [*dev, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-dev -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE agent' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent') \gexec
        SQL
    depends_on:
      postgres-dev: { condition: service_healthy }

  agent-migrate-dev:
    <<: [*dev, *agent-image]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *agent-env-dev
    depends_on:
      agent-db-dev: { condition: service_completed_successfully }

  # The agent's source under node --watch and ts-node. Root reads the keys
  # volume's .env (mode 600).
  agent-dev:
    <<: *dev
    image: node:24.21.0-trixie-slim
    working_dir: /app
    env_file: [./infra/stack/env/agent.env]
    environment:
      <<: *agent-env-dev
      CHECKPOINT_DISABLE: "1"
      TS_NODE_TRANSPILE_ONLY: "true"
    entrypoint:
      - sh
      - -ec
      - |
        if ! cmp -s package-lock.json node_modules/.package-lock.copy; then
          npm ci --no-audit --no-fund
          npx prisma generate
          cp package-lock.json node_modules/.package-lock.copy
        fi
        tokens=$$(grep -E '^AGENT_(SERVICE|MCP)_TOKEN=' /keys/.env)
        key=$$(sed -n 's/^AGENT_LLM_API_KEY=/LITELLM_API_KEY=/p' /keys/.env)
        export $$tokens $$key
        exec node --watch -r ts-node/register src/main.ts
    volumes:
      - ./agent:/app
      - agent-node-modules-dev:/app/node_modules
      - keys-dev:/keys:ro
    depends_on:
      agent-migrate-dev: { condition: service_completed_successfully }
      litellm-sync-dev: { condition: service_completed_successfully }
      redis-dev: { condition: service_healthy }
    healthcheck: *health-agent
    restart: unless-stopped

  proxy-dev:
    <<: *dev
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:56481:80"]
    configs:
      - { source: caddyfile-dev, target: /etc/caddy/Caddyfile }
    healthcheck: *health-wget
    restart: unless-stopped

  # ── prod ──

  postgres-prod:
    <<: [*prod, *postgres]
    volumes: [postgres-prod:/var/lib/postgresql]

  rustfs-prod:
    <<: [*prod, *rustfs]
    environment: *rustfs-console-env
    volumes: [rustfs-prod:/data]

  lgtm-prod:
    <<: [*prod, *lgtm]
    volumes: [lgtm-prod:/data]

  pgweb-prod:
    <<: [*prod, *pgweb]
    environment:
      PGWEB_DATABASE_URL: postgres://shopnexus:shopnexus@postgres-prod:5432/shopnexus?sslmode=disable
    depends_on:
      postgres-prod: { condition: service_healthy }

  keys-prod:
    <<: [*prod, *keys]
    volumes: [keys-prod:/home/nonroot]

  restate-prod:
    <<: [*prod, *restate]
    volumes: [restate-prod:/restate-data, keys-prod:/keys:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }

  migrate-prod:
    <<: [*prod, *server-image]
    entrypoint: ["/migrate"]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro]
    depends_on:
      litellm-keys-prod: { condition: service_completed_successfully }
      postgres-prod: { condition: service_healthy }

  objectstore-init-prod:
    <<: [*prod, *server-image]
    entrypoint: ["/objectstore-init"]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro]
    depends_on:
      litellm-keys-prod: { condition: service_completed_successfully }
      rustfs-prod: { condition: service_healthy }

  server-prod:
    <<: [*prod, *server-image]
    working_dir: /home/nonroot
    environment: *server-env-prod
    volumes: [keys-prod:/home/nonroot:ro, models-prod:/models:ro]
    depends_on:
      fetch-models-prod: { condition: service_completed_successfully }
      migrate-prod: { condition: service_completed_successfully }
      objectstore-init-prod: { condition: service_completed_successfully }
      restate-prod: { condition: service_healthy }
      litellm-sync-prod: { condition: service_completed_successfully }
    healthcheck: *health-server
    restart: unless-stopped

  website-prod:
    <<: *prod
    image: shopnexus-website:local
    build: ./website
    environment:
      API_URL: http://server-prod:8080/v1
    depends_on: [server-prod]
    healthcheck: { <<: *health, test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').catch(() => process.exit(1))"] }
    restart: unless-stopped

  # The console finds the API at api.<its own host>, so console.localhost
  # calls api.localhost.
  console-prod:
    <<: *prod
    image: shopnexus-console:local
    build: ./console
    healthcheck: *health-wget
    restart: unless-stopped

  docs-prod:
    <<: *prod
    image: shopnexus-docs:local
    build: ./docs
    healthcheck: *health-wget
    restart: unless-stopped

  fetch-models-prod:
    <<: [*prod, *server-image]
    user: "65532:65532"
    entrypoint: ["/fetch-models.sh", "/models"]
    volumes: [models-prod:/models]
    restart: "no"

  litellm-keys-prod:
    <<: [*prod, *litellm-keys]
    command: ["sh", "/etc/keys/keys.sh", "gen", "/etc/keys/keys.txt", "/keys/.env"]
    volumes: [keys-prod:/keys, ./infra/stack/litellm:/etc/keys:ro]
    depends_on:
      keys-prod: { condition: service_completed_successfully }

  litellm-db-prod:
    <<: [*prod, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-prod -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE litellm' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'litellm') \gexec
        SQL
    depends_on:
      postgres-prod: { condition: service_healthy }

  litellm-prod:
    <<: [*prod, *litellm]
    networks: { prod: { aliases: [litellm] } }
    environment:
      DATABASE_URL: postgresql://shopnexus:shopnexus@postgres-prod:5432/litellm
    volumes: [keys-prod:/keys:ro, ./infra/stack/litellm/config.yaml:/etc/litellm/config.yaml:ro]
    depends_on:
      litellm-keys-prod: { condition: service_completed_successfully }
      litellm-db-prod: { condition: service_completed_successfully }

  litellm-sync-prod:
    <<: [*prod, *litellm-sync]
    volumes: [keys-prod:/keys:ro, ./infra/stack/litellm:/etc/keys:ro]
    depends_on:
      litellm-prod: { condition: service_healthy }

  redis-prod:
    <<: [*prod, *redis]
    networks: { prod: { aliases: [redis] } }
    volumes: [redis-prod:/data]

  agent-db-prod:
    <<: [*prod, *agent-db]
    environment: { PGPASSWORD: shopnexus }
    command:
      - |
        psql -h postgres-prod -U shopnexus -d shopnexus -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE agent' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent') \gexec
        SQL
    depends_on:
      postgres-prod: { condition: service_healthy }

  agent-migrate-prod:
    <<: [*prod, *agent-image]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *agent-env-prod
    depends_on:
      agent-db-prod: { condition: service_completed_successfully }

  # The keys service's user, which owns the .env (mode 600).
  agent-prod:
    <<: [*prod, *agent-image, *agent-run]
    user: "65532:65532"
    environment: *agent-env-prod
    volumes: [keys-prod:/keys:ro]
    depends_on:
      agent-migrate-prod: { condition: service_completed_successfully }
      litellm-sync-prod: { condition: service_completed_successfully }
      redis-prod: { condition: service_healthy }
    healthcheck: *health-agent

  proxy-prod:
    <<: *prod
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:56480:80"]
    configs:
      - { source: caddyfile-prod, target: /etc/caddy/Caddyfile }
    depends_on: [server-prod, website-prod, console-prod, docs-prod, rustfs-prod]
    healthcheck: *health-wget
    restart: unless-stopped

  # ── test ──

  # go test runs a package per CPU, each test on a cloned database of about
  # 13 MB, and holds connections longer while ParadeDB writes its index.
  # Port 56433 and database server_test are what the tests' guard
  # (internal/platform/postgres/pgtest) accepts, so they never drop other data.
  postgres-test:
    <<: [*test, *postgres]
    environment:
      POSTGRES_USER: shopnexus
      POSTGRES_PASSWORD: shopnexus
      POSTGRES_DB: server_test
    command: postgres -p 56433 -c max_connections=400
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 56433 -U shopnexus -d server_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: [/var/lib/postgresql:size=4g]
    mem_limit: 4608m

  rustfs-test:
    <<: [*test, *rustfs]
    tmpfs: ["/data:size=512m,uid=10001,gid=10001"]
    mem_limit: 768m

  keys-test:
    <<: [*test, *keys]
    volumes: [keys-test:/home/nonroot]

  restate-test:
    <<: [*test, *restate]
    environment:
      <<: *restate-env
      # RocksDB sizes itself for a server; the tmpfs counts toward mem_limit.
      RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE: 256MB
    tmpfs: [/restate-data:size=1g]
    mem_limit: 2048m
    volumes: [keys-test:/keys:ro]
    depends_on:
      keys-test: { condition: service_completed_successfully }

  # The source is mounted read-only. Restate's network namespace makes
  # 127.0.0.1 here Restate's own, and the variables below override the host
  # ports in server/.env.test.
  tests:
    profiles: [test]
    image: shopnexus-server-test:local
    build:
      context: ./server
      dockerfile_inline: |
        FROM golang:1.27.3
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN go mod download
    network_mode: service:restate-test
    command: ["go", "test", "-race", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://shopnexus:shopnexus@postgres-test:56433/server_test?sslmode=disable
      TEST_RESTATE_INGRESS_URL: http://127.0.0.1:8080
      TEST_RESTATE_ADMIN_URL: http://127.0.0.1:9070
      TEST_RESTATE_IDENTITY_FILE: /keys/identity.pem
      TEST_OBJECT_STORE_ENDPOINT: http://rustfs-test:9000
      TEST_OBJECT_STORE_PUBLIC_ENDPOINT: http://rustfs-test:9000
      TEST_OBJECT_STORE_ACCESS_KEY: shopnexus
      TEST_OBJECT_STORE_SECRET_KEY: shopnexus-secret
      TEST_MEDIA_PUBLIC_URL: http://rustfs-test:9000/server-test
    volumes: [./server:/src:ro, keys-test:/keys:ro, go-build-test:/root/.cache/go-build]
    depends_on:
      postgres-test: { condition: service_healthy }
      rustfs-test: { condition: service_healthy }
      restate-test: { condition: service_healthy }

networks:
  dev:
  prod:
  test:

configs:
  air-dev:
    content: |
      tmp_dir = "/tmp/air"
      [build]
        cmd = "go build -buildvcs=false -o /tmp/bin/ ./cmd/server ./cmd/migrate"
        entrypoint = ["sh", "-c", "/tmp/bin/migrate && exec /tmp/bin/server"]
        include_ext = ["go", "sql"]
        exclude_dir = ["tmp", "bin", ".git", ".restate", ".worktrees", ".claude", ".superpowers", ".zed", "e2e", "api"]
        exclude_regex = ["_test\\.go$$"]
        delay = 300
        send_interrupt = true
        kill_delay = "5s"
      [log]
        main_only = true
  caddyfile-dev:
    content: |
      {
        auto_https off
        admin off
      }
      http://shopnexus.localhost {
        reverse_proxy website-dev:4321
      }
      http://api.shopnexus.localhost {
        reverse_proxy server-dev:8080
      }
      http://media.shopnexus.localhost {
        reverse_proxy rustfs-dev:9000
      }
      http://docs.shopnexus.localhost {
        reverse_proxy docs-dev:4321
      }
      http://console.shopnexus.localhost {
        reverse_proxy console-dev:5173
      }
      http://grafana.shopnexus.localhost {
        reverse_proxy lgtm-dev:3000 {
          header_up X-Console-Email admin@shopnexus.localhost
          header_up X-Console-Role Admin
        }
      }
      http://restate.shopnexus.localhost {
        reverse_proxy restate-dev:9070
      }
      http://db.shopnexus.localhost {
        reverse_proxy pgweb-dev:8081
      }
      http://s3.shopnexus.localhost {
        redir / /rustfs/console/
        reverse_proxy rustfs-dev:9001
      }
  caddyfile-prod:
    content: |
      {
        auto_https off
        admin off
      }
      http://shopnexus.localhost {
        reverse_proxy website-prod:3000
      }
      http://api.shopnexus.localhost {
        reverse_proxy server-prod:8080
      }
      http://media.shopnexus.localhost {
        reverse_proxy rustfs-prod:9000
      }
      http://docs.shopnexus.localhost {
        reverse_proxy docs-prod:80
      }
      http://console.shopnexus.localhost {
        reverse_proxy console-prod:80
      }
      http://grafana.shopnexus.localhost {
        reverse_proxy lgtm-prod:3000 {
          header_up X-Console-Email admin@shopnexus.localhost
          header_up X-Console-Role Admin
        }
      }
      http://restate.shopnexus.localhost {
        reverse_proxy restate-prod:9070
      }
      http://db.shopnexus.localhost {
        reverse_proxy pgweb-prod:8081
      }
      http://s3.shopnexus.localhost {
        redir / /rustfs/console/
        reverse_proxy rustfs-prod:9001
      }

volumes:
  postgres-dev:
  rustfs-dev:
  restate-dev:
  keys-dev:
  models-dev:
  go-build-dev:
  go-mod-dev:
  docs-node-modules-dev:
  docs-astro-dev:
  website-node-modules-dev:
  website-astro-dev:
  console-node-modules-dev:
  agent-node-modules-dev:
  lgtm-dev:
  redis-dev:
  postgres-prod:
  rustfs-prod:
  restate-prod:
  keys-prod:
  models-prod:
  lgtm-prod:
  redis-prod:
  keys-test:
  go-build-test:
