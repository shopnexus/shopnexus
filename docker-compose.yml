# Local DEV stack for the whole system.
#
#   docker compose --profile app up --build     # everything: infra + gateway + storefront + docs
#   docker compose up -d                        # infra only (db, redis, nats, grafana, loki, alloy)
#
# This file defines NO services of its own. Each submodule owns how it builds and
# runs itself, and this file composes those definitions — so infra versions have
# exactly one source of truth (the submodule that depends on them).
#
# Why `--profile app` is required: the server's compose keeps `gateway` and
# `migrate` behind `profiles: ["app"]` so a backend developer gets infra-only by
# default and runs the binary on the host. Compose does not let an including file
# clear an inherited profile list — an override of `profiles: []` is ignored, the
# services stay gated — so the flag is the honest way to pull them in, not an
# oversight.
#
# Backend only:    cd server  && docker compose up
# Storefront only: cd website && docker compose up
#
# Production is Kubernetes — see ./deploy. This file is dev-only.
name: shopnexus

include:
  - server/docker-compose.yml
  - website/docker-compose.yml
  - docs/docker-compose.yml
