# Argo CD Application for the monitoring stack (Loki + Alloy + Grafana over
# TimescaleDB). No Prometheus — metrics go straight into hypertables.
#
# Separate from the main app so monitoring never gates the app rollout. Images are
# pinned upstream tags — no Image Updater.
#
# Needs two out-of-band cluster settings, since the dashboard ConfigMap is generated
# from the server submodule — see deploy/monitoring/README.md "The dashboard comes
# from the server submodule".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopnexus-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shopnexus/shopnexus.git
    targetRevision: main
    path: deploy/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: shopnexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
