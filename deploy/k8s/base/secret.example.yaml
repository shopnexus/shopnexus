# TEMPLATE ONLY — do not commit real secrets.
#
# Create the real Secret out-of-band (it is git-ignored / never in the repo):
#
#   PG_PASS='<pg-pass>'
#   DSN="postgres://shopnexus:$PG_PASS@postgres:5432/shopnexus?sslmode=disable"
#   kubectl -n shopnexus create secret generic shopnexus-secret \
#     --from-literal=POSTGRES_PASSWORD="$PG_PASS" \
#     --from-literal=REDIS_PASSWORD='<redis-pass>' \
#     --from-literal=JWT_SECRET='<>=32-byte-jwt-signing-secret>' \
#     --from-literal=ID_CIPHER_KEY='<16-24-or-32-byte-key>' \
#     --from-literal=ACCOUNT_DB_DSN="$DSN" \
#     --from-literal=CATALOG_DB_DSN="$DSN" \
#     --from-literal=ORDER_DB_DSN="$DSN" \
#     --from-literal=CHAT_DB_DSN="$DSN" \
#     --from-literal=COMMON_DB_DSN="$DSN" \
#     --from-literal=TRUST_DB_DSN="$DSN" \
#     --from-literal=FINANCE_DB_DSN="$DSN" \
#     --from-literal=OBSERVABILITY_DB_DSN="$DSN"
#
# One value per secret. The postgres/redis containers read POSTGRES_PASSWORD /
# REDIS_PASSWORD directly — the image env names are the same keys, mapped in
# postgres.yaml / redis.yaml, so there is no duplicate value to keep in sync.
#
# One DSN per module: they all point at the same database today and isolate their
# tables by Postgres schema (search_path is set per pool to the module name), so
# any one of them can move to its own server later without a code change.
apiVersion: v1
kind: Secret
metadata:
  name: shopnexus-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  # Min 32 bytes — validated at startup.
  JWT_SECRET: "CHANGE_ME_32_BYTES_MINIMUM_XXXXXX"
  # Exactly 16, 24 or 32 bytes. PERMANENT: rotating this invalidates every opaque
  # id ever handed out. Back it up like a database credential.
  ID_CIPHER_KEY: "0123456789abcdef0123456789abcdef"
  ACCOUNT_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  CATALOG_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  ORDER_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  CHAT_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  COMMON_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  TRUST_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  FINANCE_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
  OBSERVABILITY_DB_DSN: "postgres://shopnexus:CHANGE_ME@postgres:5432/shopnexus?sslmode=disable"
