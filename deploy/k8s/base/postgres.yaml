apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # 20Gi: telemetry hypertables grow faster than the old relational-only
      # schema. k3d's local-path class cannot expand in place — this applies to a
      # fresh volume, not an existing one.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shopnexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: shopnexus
    spec:
      containers:
        - name: postgres
          # timescaledb-ha, not plain postgres or pgvector: the migrations need
          # timescaledb, timescaledb_toolkit, vector, postgis, pg_trgm and
          # unaccent. Only the -ha image bundles all six.
          image: timescale/timescaledb-ha:pg18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: shopnexus
            - name: POSTGRES_DB
              value: shopnexus
            - name: POSTGRES_PASSWORD          # env name the image requires
              valueFrom:
                secretKeyRef:
                  name: shopnexus-secret
                  key: POSTGRES_PASSWORD       # single source key (shared with the app)
            - name: PGDATA
              value: /home/postgres/pgdata/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U shopnexus -d shopnexus"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U shopnexus -d shopnexus"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /home/postgres/pgdata
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
