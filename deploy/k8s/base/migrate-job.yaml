# Runs `/migrate` (embedded, idempotent) as a wave-1 Sync hook: after wave-0 infra is
# healthy, before the wave-2 app rollout. Creates one Postgres schema per module.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    # hook-delete-policy recreates it each sync — Jobs are immutable.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: shopnexus
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: migrate
          image: ghcr.io/shopnexus/server:main
          imagePullPolicy: Always
          command: ["/migrate"]
          # Full env, not just the DSNs: cmd/migrate calls the same config.Load as the
          # gateway, so it validates every field.
          envFrom:
            - configMapRef:
                name: shopnexus-config
            - secretRef:
                name: shopnexus-secret
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
